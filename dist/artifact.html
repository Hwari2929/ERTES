<title>ERRANTEs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>/* 용병단 전술 단말기: 잉크빛 남색 바탕 + 계약서 호박색 강조. 단일 다크 룩. */
:root {
  --bg: #0f1219;
  --panel: #171c26;
  --panel-2: #1e2532;
  --line: #2b3445;
  --fg: #e9e4d8;
  --dim: #8d96a8;
  --accent: #f2a93b;
  --accent-ink: #1a1206;
  --good: #63d297;
  --bad: #ff6b5e;
  --info: #6cb6ff;
  --fame: #ff9de2;
  --staff: #c9b37a;
  --ally-hp: #63d297;
  --foe-hp: #ff6b5e;
  --shield: #e9e4d8;
  --cell-mine: #1b2433;
  --cell-foe: #22191c;
  --cell-mid: #161b24;
  --overlay: rgba(6, 8, 12, 0.78);
  --el-phys: #eceae4; --el-chem: #9be15d; --el-elec: #62d6ff; --el-psy: #d48cff; --el-holy: #ffd866; --el-true: #ff7a7a;
  --f-display: 'Black Han Sans', 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-body: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
#app { min-height: 100%; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.05rem; color: var(--accent); margin-block: 18px 8px; }
h3 { font-size: 0.95rem; margin-block: 14px 6px; }
p { margin: 0; }
.muted { color: var(--dim); }
.small { font-size: 0.82rem; }
.fine { margin-top: 24px; }
.accent { color: var(--accent); }
.bad { color: var(--bad); }
.up { color: var(--good); }
.down { color: var(--bad); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── 버튼 */
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 800; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: .85rem; }
.btn.tiny { padding: 2px 8px; font-size: .8rem; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

/* ── 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-size: 1.3rem; color: var(--accent); letter-spacing: .04em; }
.stat-row { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.pill { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-variant-numeric: tabular-nums; }
.pill b { color: var(--fg); }
.pill.hp b { color: var(--bad); }
.pill.cr b { color: var(--accent); }
.pill.faith { border-color: var(--el-holy); color: var(--el-holy); }
.pill.fame { border-color: var(--fame); color: var(--fame); }
.pill.faith b, .pill.fame b { color: inherit; }
.staff-on { color: var(--staff); margin-bottom: 4px; }
.ustaff { position: absolute; left: 4%; top: 10%; font-size: 12px; color: var(--staff); text-shadow: 1px 1px 0 #000; }

/* ── 공통 레이아웃 */
.wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 0; flex: 1; }
.screen-head { display: grid; gap: 6px; margin-bottom: 16px; }
.side { min-width: 0; }
.sticky-actions { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); margin-top: 12px; z-index: 5; }

/* ── 타이틀 */
.title-screen { flex: 1; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 48px 16px; text-align: center; }
.logo { font-family: var(--f-display); font-size: clamp(3rem, 12vw, 6.5rem); line-height: 1; color: var(--accent); letter-spacing: .02em;
  text-shadow: 4px 4px 0 var(--accent-ink), 6px 6px 0 var(--line); }
.tagline { color: var(--dim); letter-spacing: .12em; font-size: .9rem; }
.title-actions, .slots { display: flex; flex-direction: column; gap: 8px; width: min(320px, 100%); margin-top: 12px; }
.title-actions small { display: block; font-weight: 400; opacity: .8; }

/* ── 칩 / 스프라이트 */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-block: 6px; }
.chip { border: 1px solid var(--c); color: var(--c); border-radius: 4px; padding: 0 6px; font-size: .75rem; white-space: nowrap; }
.spr { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
.spr.big { width: 56px; height: 56px; }
.rank { font-family: var(--f-mono); font-size: .75rem; color: var(--accent-ink); background: var(--accent); border-radius: 3px; padding: 0 5px; font-weight: 700; flex: none; }
.xp { position: relative; height: 12px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-block: 4px; }
.xp i { position: absolute; inset: 0 auto 0 0; background: var(--info); opacity: .55; }
.xp b { position: relative; display: block; font: 600 9px/12px var(--f-mono); text-align: center; }
.xp.max i { background: var(--accent); }

/* ── 기물 카드 */
.ucard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ucard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; display: grid; gap: 6px; align-content: start; }
.ucard:hover { border-color: var(--dim); }
.ucard.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ucard-head, .d-head { display: flex; gap: 10px; align-items: center; }
.d-head > div { flex: 1; min-width: 0; }
.skill-line { font-size: .82rem; background: var(--panel-2); border-radius: 4px; padding: 6px 8px; }
.majors-mini { display: flex; gap: 8px; flex-wrap: wrap; font-size: .75rem; color: var(--dim); }
.majors-mini b { color: var(--fg); }

/* ── 맵 */
.map { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
.track { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; counter-reset: n; }
.track li { counter-increment: n; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: .8rem; color: var(--dim); }
.track li::before { content: counter(n) ' '; font-family: var(--f-mono); color: var(--line); }
.track li.done { opacity: .55; }
.track li.cur { border-color: var(--accent); color: var(--fg); }
.node-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.node-btn { display: grid; gap: 4px; justify-items: start; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; cursor: pointer; }
.node-btn:hover { border-color: var(--accent); }
.node-btn b { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; }
.node-ic { font-size: 1.6rem; line-height: 1; color: var(--accent); }
.n-adversity .node-ic, .n-boss .node-ic { color: var(--bad); }
.roster { display: grid; gap: 6px; }
.roster-row { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; text-align: left; }
.roster-row.bench { opacity: .6; }
.rr-main { flex: 1; min-width: 0; }
.rr-main b { font-size: .85rem; }
.rr-items { display: flex; gap: 2px; }
.quests, .globals, .log { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: .82rem; }
.quests li.done { text-decoration: line-through; color: var(--good); }
.log li { color: var(--dim); }

/* ── 시너지 */
.syn-list { display: grid; gap: 4px; }
.syn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; opacity: .65; }
.syn.active { opacity: 1; border-color: var(--c); }
.syn summary { display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; }
.syn summary::-webkit-details-marker { display: none; }
.syn-ic { color: var(--c); width: 1.2em; text-align: center; }
.syn-name { flex: 1; font-size: .85rem; display: flex; flex-direction: column; line-height: 1.15; }
.syn-count { min-width: 1.6em; text-align: center; font: 700 .95rem var(--f-mono); color: var(--c); background: var(--panel-2); border-radius: 4px; padding: 1px 4px; }
.syn.active .syn-count { color: var(--accent-ink); background: var(--c); }
.syn-next { font-size: .68rem; color: var(--dim); }
.syn.benchonly { opacity: .4; }
.syn-members { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0 2px; }
.syn-members span { font-size: .72rem; padding: 1px 6px; border-radius: 3px; background: var(--panel-2); }
.syn-members span.on { color: var(--fg); border: 1px solid var(--c); }
.syn-members span.bench { color: var(--dim); border: 1px dashed var(--line); }
.syn-steps { display: flex; gap: 2px; font: 600 .7rem var(--f-mono); }
.syn-steps span { padding: 0 4px; border-radius: 3px; color: var(--dim); background: var(--panel-2); }
.syn-steps span.on { color: var(--accent-ink); background: var(--c); }
.syn p, .syn ol { font-size: .78rem; color: var(--dim); margin: 6px 0; }
.syn ol { padding-left: 1em; list-style: none; }
.syn li.cur { color: var(--fg); }

/* ── 보드 */
.prep { display: grid; grid-template-columns: 240px minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.battle { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
.board-col { min-width: 0; }
.board-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.board-head .speed { margin-left: auto; display: flex; gap: 4px; }
.board { position: relative; width: min(100%, 560px); aspect-ratio: 1; margin: 0 auto; max-width: 100%; user-select: none; -webkit-user-select: none; }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); gap: 2px; }
.cell { background: var(--cell-mid); border-radius: 3px; }
.cell.mine { background: var(--cell-mine); }
.cell.foe { background: var(--cell-foe); }
.cell.drop-hover { outline: 2px dashed var(--accent); }
.u { position: absolute; display: grid; place-items: center; transition: none; }
.u.placed { cursor: grab; touch-action: none; }
.u img { width: 82%; height: 82%; image-rendering: pixelated; pointer-events: none; }
.u.side1 img { transform: scaleX(-1); }
.u.big img { width: 105%; height: 105%; }
.u.boss img { filter: drop-shadow(0 0 6px var(--bad)); }
.u.sel { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.u.dragging, .bench-u.dragging { opacity: .35; }
.ubadge { position: absolute; right: 4%; bottom: 4%; font: 700 10px var(--f-mono); background: var(--accent); color: var(--accent-ink); padding: 0 3px; border-radius: 2px; }
.uitems { position: absolute; left: 6%; bottom: 6%; display: flex; gap: 2px; }
.uitems i { width: 5px; height: 5px; background: var(--info); border-radius: 1px; }
.bars { position: absolute; left: 8%; right: 8%; top: 2%; height: 6px; background: rgba(0, 0, 0, .55); border-radius: 2px; overflow: hidden; }
.bars .hp { position: absolute; inset: 0 auto 0 0; background: var(--ally-hp); }
.side1 .bars .hp { background: var(--foe-hp); }
.bars .sh { position: absolute; inset: 0 auto 0 0; background: var(--shield); opacity: .75; }
.cd { position: absolute; left: 14%; right: 14%; bottom: 3%; height: 3px; background: rgba(0, 0, 0, .5); }
.cd i { display: block; height: 100%; background: var(--info); }
.u.hit img { animation: hit .18s; }
.u.lunge img { animation: lunge .2s; }
.side1.lunge img { animation: lunge-f .2s; }
.u.dead { opacity: 0; transition: opacity .5s; pointer-events: none; }
.u.stunned img { filter: brightness(.6) sepia(1) hue-rotate(10deg); }
.u.feared img { filter: hue-rotate(220deg) saturate(1.6); }
.u.shocked .cd i { background: var(--el-elec); animation: blink .3s infinite; }
@keyframes hit { 50% { filter: brightness(2.2); } }
@keyframes lunge { 50% { transform: translateY(-14%); } }
@keyframes lunge-f { 50% { transform: scaleX(-1) translateY(14%); } }
@keyframes blink { 50% { opacity: .2; } }
.fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: visible; }
.ft { position: absolute; transform: translate(-50%, 0); font: 700 13px var(--f-mono); text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; white-space: nowrap; animation: float .9s ease-out forwards; }
.ft.crit { font-size: 18px; }
.ft.graze { font-size: 11px; opacity: .8; }
.ft.miss { color: var(--dim); font-size: 11px; }
.ft.heal { color: var(--good); }
.ft.shield { color: var(--shield); font-size: 11px; }
.ft.status { color: var(--accent); font: 600 11px var(--f-body); }
.ft.skill { color: var(--accent); font: 400 14px var(--f-display); animation-duration: 1.1s; }
@keyframes float { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -150%); opacity: 0; } }
.proj { position: absolute; width: 6px; height: 6px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 6px currentColor; }
.area { position: absolute; border: 2px solid; border-radius: 14%; animation: area .6s ease-out forwards; }
@keyframes area { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.05); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ft, .area { animation-duration: .01s; } }

.bench { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 64px; margin: 10px auto 0; width: min(100%, 560px);
  background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; }
.bench-label { font-size: .75rem; color: var(--dim); writing-mode: vertical-rl; }
.bench-u { position: relative; width: 52px; height: 52px; background: var(--panel-2); border-radius: 6px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.bench-u img { width: 44px; height: 44px; image-rendering: pixelated; pointer-events: none; }
.bench-u.sel { outline: 2px solid var(--accent); }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%); width: 56px; height: 56px; display: grid; place-items: center; font-size: 1.6rem; }
.drag-ghost img { width: 100%; height: 100%; image-rendering: pixelated; }

/* ── 장비 */
.inv { width: min(100%, 560px); margin: 10px auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.inv-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.inv-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.inv-detail { margin-top: 8px; font-size: .85rem; }
.item { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); font-size: 15px; cursor: grab; touch-action: none; flex: none; }
.item.empty { border-style: dashed; cursor: default; }
.item.tA { border-color: var(--info); color: var(--info); }
.item.tL { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px var(--accent); }
.item.tM { border-color: #c38cff; color: #c38cff; }
.item.tM:not(.empty) { border-radius: 50%; }
.eq-slot.mod { border-color: #c38cff55; }
.item.sel { outline: 2px solid var(--accent); }
.rr-items .item { width: 18px; height: 18px; font-size: 10px; cursor: default; }
.eq { display: grid; gap: 6px; }
.eq-slot { display: flex; gap: 8px; align-items: center; background: var(--panel-2); border-radius: 6px; padding: 6px; touch-action: none; }
.eq-slot > span { flex: 1; min-width: 0; font-size: .82rem; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.shop-item { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.shop-item > div { flex: 1; min-width: 0; }
.shop-item.sold { opacity: .4; }

/* ── 상세 패널 */
.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.majors { display: grid; gap: 3px; }
.major { display: grid; grid-template-columns: 4em 1fr 2.2em 2.4em; gap: 6px; align-items: center; font-size: .82rem; }
.major b { text-align: right; font-variant-numeric: tabular-nums; }
.mbar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--accent); }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .8rem; margin: 0; }
.stats dt { color: var(--dim); }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.stats.big { font-size: 1rem; max-width: 360px; margin-bottom: 16px; }
.augs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .82rem; }
.src { font-size: .7rem; color: var(--accent); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.lore { margin-top: 14px; font-size: .8rem; color: var(--dim); font-style: italic; }

/* ── 전투 측면 */
.meter { display: grid; gap: 4px; }
.mrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) 70px auto; gap: 6px; align-items: center; font-size: .78rem; }
.mrow .spr { width: 24px; height: 24px; }
.mrow.dead { opacity: .4; }
.mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heal-t { color: var(--good); grid-column: 2 / -1; text-align: right; margin-top: -4px; }

/* ── 모달 */
.modal-bg { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; width: min(820px, 100%); max-height: 92vh; overflow: auto; display: grid; gap: 12px; }
.modal h1 { font-size: 1.6rem; color: var(--accent); }
.modal.result.win h1 { color: var(--good); }
.modal.result.lose h1 { color: var(--bad); }
.lines, .xp-gain { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; }
.xp-gain { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.xp-gain li { display: flex; align-items: center; gap: 6px; font-size: .85rem; }
.xp-gain b { color: var(--info); margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.card { display: grid; gap: 6px; align-content: start; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; cursor: pointer; min-height: 120px; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); transition: transform .12s; }
.card b { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; }
.card span:not(.src) { font-size: .85rem; color: var(--dim); }
.card .src { justify-self: start; }
.card.aug-unit { border-color: var(--accent); }
.alloc { display: grid; gap: 6px; }
.alloc-row { display: grid; grid-template-columns: 8em minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 6px; padding: 6px 10px; }
.a-btns { display: flex; gap: 4px; }
textarea, input[type=file] { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px var(--f-mono); }
.slot-list { display: grid; gap: 6px; }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel-2); border-radius: 6px; padding: 6px 10px; }
.slot > span:last-child { display: flex; gap: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 200; background: var(--fg); color: var(--bg);
  padding: 8px 16px; border-radius: 6px; font-weight: 600; max-width: calc(100% - 32px); }

/* ── 반응형 */
@media (max-width: 1100px) {
  .prep { grid-template-columns: minmax(0, 1fr) 300px; }
  .prep .side.left { grid-column: 1 / -1; order: 3; }
}
@media (max-width: 860px) {
  .top { position: static; gap: 6px 10px; padding-block: 8px; }
  .brand { font-size: 1.1rem; }
  .pill { font-size: .75rem; padding: 1px 8px; }
  .map, .prep, .battle { grid-template-columns: minmax(0, 1fr); }
  .prep .side.left { order: 2; }
  .prep .side.right { order: 1; }
  .prep .board-col { order: 0; }
  h1 { font-size: 1.5rem; }
  .alloc-row { grid-template-columns: 1fr auto; }
  .alloc-row .small { grid-column: 1 / -1; grid-row: 2; }
}

/* 전장 */
.pill.field { border-color: var(--c); color: var(--c); }
.field-card { border: 1px solid var(--c); border-left: 4px solid var(--c); border-radius: 8px; padding: 10px 12px; background: var(--panel); display: grid; gap: 6px; margin: 8px 0; }
.field-card.compact { padding: 8px 10px; }
.fc-head { display: flex; gap: 10px; align-items: center; }
.fc-ic { font-size: 1.5rem; color: var(--c); width: 1.4em; text-align: center; }
.fc-rules { margin: 0; padding-left: 1.1em; font-size: .82rem; }
.fc-rules li::marker { color: var(--c); }

/* 난이도 */
.diff-picker { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: grid; gap: 6px; }
.diff-row { display: flex; flex-wrap: wrap; gap: 4px; }
.diff-picker ul { margin: 0; padding-left: 1.1em; }
/* 사건 */
.event.rare h1 { color: var(--accent); text-shadow: 0 0 12px var(--accent); }
.card[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.tag { font-size: .68rem; padding: 0 5px; border-radius: 3px; border: 1px solid var(--accent); color: var(--accent); }
/* 방출 */
.release { margin-top: 12px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px; }
.release.confirm { border-color: #ff6a6a; }
.release ul { margin: 4px 0 8px; padding-left: 1.1em; }
.btn.danger { background: #b03030; border-color: #ff6a6a; color: #fff; }
.down { color: #ff7a7a; }
/* 전투 기록 */
.meter-tabs { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
.mrow { cursor: pointer; }
.mrow.sel { outline: 1px solid var(--accent); border-radius: 4px; }
.mbar { position: relative; }
.mbar .ebar { position: absolute; inset: 0; opacity: .25; }
.mbar .fill { position: relative; }
.ebar { display: flex; height: 8px; min-width: 60px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.ebar i { display: block; height: 100%; }
.bunit { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.bunit h3 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .9rem; }
.bitems { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.bitems li { display: flex; gap: 6px; align-items: flex-start; font-size: .8rem; }
.btable-wrap { overflow-x: auto; max-width: 100%; }
.btable { border-collapse: collapse; font-size: .78rem; width: 100%; }
.btable th, .btable td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.btable th:first-child, .btable td:first-child { text-align: left; }
.btable td:first-child .spr { width: 18px; height: 18px; vertical-align: middle; }
.btable tr.dead { opacity: .5; }
.elegend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.elegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; }
.modal.result { max-width: min(760px, 100%); }
/* 도감 */
.codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 10px; }
.codex-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.codex-card.unknown .spr, .codex-row.unknown .spr { filter: brightness(0); opacity: .6; }
.codex-stats { color: var(--dim); border-top: 1px solid var(--line); padding-top: 4px; }
.codex-list { display: grid; gap: 4px; margin-bottom: 12px; }
.codex-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.codex-row:not(:has(.spr)) { grid-template-columns: minmax(0, 1fr) auto; }
.codex-row.unknown { opacity: .6; }
.codex-row.rare { border-color: var(--accent); }

/* ── 초상화 · 스탠딩 */
.spr.pt { image-rendering: auto; border-radius: 6px; background: var(--panel-2); object-fit: cover; }
.u img.pt { image-rendering: auto; border-radius: 50%; width: 88%; height: 88%; background: var(--panel-2); box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgb(0 0 0 / .5); }
.hero { position: relative; height: 240px; margin: -12px -12px 4px; border-radius: 8px 8px 0 0; overflow: hidden; cursor: zoom-in;
  background: radial-gradient(120% 90% at 50% 20%, var(--panel-2), var(--panel) 70%); }
.hero::after { content: ''; position: absolute; inset: auto 0 0; height: 40%; background: linear-gradient(transparent, var(--panel)); pointer-events: none; }
.hero .stand { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
.hero.sm { height: 130px; cursor: inherit; }
.hero.sm .stand { object-position: 50% 20%; }
.hero.sm::after { height: 28%; }
.ucard > .hero.sm, .codex-card > .hero.sm { margin: -12px -12px 2px; }
.codex-card > .hero.sm { margin: -10px -10px 2px; cursor: zoom-in; }
.modal .hero.sm { margin: 0; border-radius: 8px; height: 220px; }
.modal .hero .stand { width: auto; height: 100%; margin: 0 auto; object-fit: initial; }
.stand-view { position: fixed; inset: 0; z-index: 80; background: rgb(8 10 14 / .92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.stand-view .stand.full { max-height: calc(100dvh - 72px); max-width: 100%; object-fit: contain; }
.stand-cap { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; }

D10\uC8FC\uB294 \uC0BC\uCD0C\uC5D0 \uAC00\uAE5D\uB2E4. \uC8FC\uBB34\uC7A5\uC778 \uAE30\uAD00\uCD1D \uD5E4\uBE44 \uBC84\uB2C8\uB294 \uB9C9\uB0B4\uC544\uB4E4\uC774 \uC5B4\uB838\uC744 \uB54C \uC9C0\uC5B4\uC900 \uC774\uB984\uC774\uBA70, \uBC14\uAFC0 \uC0DD\uAC01\uC740 \uC804\uD600 \uC5C6\uB2E4.",donovan:"\uB3C4\uB178\uBC18\uC740 \uBCF4\uC548\uC704\uC6D0\uD68C \uD2B9\uC218 \uC694\uC6D0 \uC2DC\uC808\uC758 \uD638\uCD9C\uBA85 \uBC24\uAE4C\uB9C8\uADC0\uB97C \uADF8\uB300\uB85C \uC4F0\uB294 \uC5D0\uB780\uD14C\uC2A4\uC758 \uD574\uCEE4\uC774\uC790 \uCE68\uD22C \uC694\uC6D0\uC774\uB2E4. \uC790\uC548\uC758 \uC0AC\uC218 \uBCC0\uC774\uB85C \uAE09\uC18C\uC640 \uD574\uD0B9 \uC131\uACF5 \uD655\uB960\uC774 \uB208\uC5D0 \uBCF4\uC774\uC9C0\uB9CC, \uBCF8\uC778\uC5D0\uAC8C\uB294 \uC624\uB298 \uC800\uB141 \uBA54\uB274\uC640 \uD638\uB791\uC774 \uC0AC\uB8CC\uAC12\uC774 \uB354 \uC911\uC694\uD558\uB2E4. \uACC1\uC744 \uB5A0\uB2E4\uB2C8\uB294 \uD574\uD0B9 \uB4DC\uB860\uC740 \uB9AC\uBE44\uBCFC\uB4DC \uACBD\uC774\uB77C \uBD88\uB7EC \uB2EC\uB77C\uACE0 \uC694\uAD6C\uD558\uB098, \uC544\uBB38\uC13C\uC744 \uC81C\uC678\uD55C \uC804\uC6D0\uC774 \uAE4C\uC545\uC774\uB77C \uBD80\uB978\uB2E4.",chloe:"\uD074\uB85C\uC5D0 \uC5D0\uBC00\uD134\uC740 \uC804\uC9C1 \uBCF4\uC548\uC704\uC6D0\uD68C \uC7A0\uC785 \uC694\uC6D0\uC73C\uB85C, \uC9C0\uAE08\uC740 \uC5D0\uB780\uD14C\uC2A4 \uC758\uBB34\uC2E4\uC5D0\uC11C \uC57D\uC744 \uC81C\uC870\uD558\uACE0 \uACE0\uC704\uD5D8 \uD654\uD559\uC7AC\uC758 \uBC18\uCD9C\uC785\uC744 \uCC98\uB9AC\uD55C\uB2E4. \uCD08\uB300\uBC1B\uC9C0 \uC54A\uC740 \uC790\uB9AC\uC5D0 \uCD08\uB300\uBC1B\uC740 \uC190\uB2D8\uCC98\uB7FC \uC549\uC544 \uC788\uB294 \uAC83\uC774 \uAE30\uBCF8 \uB3D9\uC791\uC774\uBA70, \uC81C\uC9C0\uB2F9\uD558\uBA74 \uC0AC\uACFC\uD558\uC9C0 \uC54A\uACE0 \uB418\uBB3B\uB294\uB2E4. \uD1F4\uC0AC \uAE30\uB150 \uC5EC\uD589 \uC911 \uB4E4\uB978 \uBC14\uC5D0\uC11C 3\uB144\uAC04 \uC5F0\uB77D\uC774 \uB04A\uACBC\uB358 \uC624\uBE60\uB97C \uB9CC\uB0AC\uACE0, \uC544\uBB38\uC13C\uACFC \uC0C1\uB2F4\uD558\uB2E4 \uBCF4\uB2C8 \uC5B4\uB290\uC0C8 \uACC4\uC57D\uC774 \uCCB4\uACB0\uB418\uC5B4 \uC788\uC5C8\uB2E4.",west:"\uC6E8\uC2A4\uD2B8 \uD640\uB4E0\uC740 \uC5F0\uD569\uAD70 \uC6D0\uC0AC \uCD9C\uC2E0\uC73C\uB85C, \uACE0\uCD9C\uB825 \uD575\uC735\uD569 \uBC1C\uC804 \uC2DC\uC124\uBD80\uD130 \uCEA3\uD0C0\uC6CC\uAE4C\uC9C0 \uC5D0\uB780\uD14C\uC2A4\uC758 \uC2DC\uC124\uACFC \uC7A5\uBE44 \uC804\uBC18\uC744 \uAD00\uB9AC\uD55C\uB2E4. \uC2DC\uBE44\uC870\uB85C \uD22D\uD22D \uB358\uC9C0\uB294 \uB9D0\uD22C\uC640 \uB2EC\uB9AC \uC9C0\uB3C5\uD55C \uC6CC\uCEE4\uD640\uB9AD\uC774\uB2E4. \uC778\uACF5 \uD3D0\uB97C \uC7A5\uCC29\uD558\uACE0 \uC788\uB294\uB370, \uC758\uB8CC\uC801 \uD544\uC694 \uB54C\uBB38\uC774 \uC544\uB2C8\uB77C \uD558\uB8E8 \uD55C \uAC11\uC758 \uD761\uC5F0\uC744 \uC9C0\uC18D\uD558\uAE30 \uC704\uD574\uC11C\uB2E4.",lindiwe:"\uB9B0\uB514\uC6E8 \uB85C\uC6B4\uC740 \uC5D0\uB780\uD14C\uC2A4 \uC804\uC6A9 \uC758\uB8B0 \uCC3D\uAD6C\uB85C \uC2E0\uC124\uB41C \uD398\uD2B8\uB77C \uD2B9\uBCC4\uACBD\uD638\uD300\uC758 \uD611\uB825\uD300\uC7A5\uC73C\uB85C, \uC758\uB8B0 \uC218\uC8FC\uC640 \uBCF4\uC0C1 \uC9C0\uAE09\uC744 \uB9E1\uB294\uB2E4. \uC2E0\uC6A9 \uD06C\uB808\uB527\uC744 \uC790\uC720\uC758 \uB2E8\uC704\uB85C \uC5EC\uAE30\uBA70, \uD611\uC0C1 \uD14C\uC774\uBE14\uC5D0\uC11C\uB294 \uBC1D\uB358 \uB9D0\uD22C\uAC00 \uAC00\uB77C\uC549\uACE0 \uBB38\uC7A5\uC774 \uC9E7\uC544\uC9C4\uB2E4. \uD138 \uB09C \uC9D0\uC2B9, \uD2B9\uD788 \uACE0\uC591\uC774\uB97C \uC0AC\uB791\uD558\uBA70, \uD544\uB9AC\uC2A4\uC5D0\uAC8C \uC720\uB3C5 \uD06C\uB808\uB527\uC744 \uB354 \uC5B9\uC5B4 \uC8FC\uB294 \uAC83\uC740 \uCC29\uAC01\uC774 \uC544\uB2C8\uB2E4.",orca:"\uC624\uB974\uCE74 \uC2E4\uB9AC\uBE0C\uB9AC\uC6C0\uC740 \uD398\uD2B8\uB77C \uBCF8\uC0AC\uC5D0\uC11C \uC790\uAE08 \uD6A1\uB839\uACFC \uBD84\uC2DD \uD68C\uACC4\uB85C \uD574\uACE0\uB41C \uBC94\uACE0\uB798 \uD658\uC218\uB85C, \uC774 \uC804\uB825\uC744 \uC228\uAE30\uC9C0 \uC54A\uC740 \uCC44 \uC5D0\uB780\uD14C\uC2A4\uC758 \uC7AC\uC815\uC744 \uB9E1\uACE0 \uC788\uB2E4. \uBE44\uACF5\uC2DD \uC0C1\uB2F4\uAC00\uC774\uAE30\uB3C4 \uD558\uB098, \uC0C1\uB2F4\uC740 \uC0C1\uB300\uC758 \uB9D0\uC744 \uB4E3\uB294 \uB300\uC2E0 \uC790\uAE30 \uC774\uC57C\uAE30\uB97C \uC3DF\uC544\uB0B4\uB294 \uBC29\uC2DD\uC73C\uB85C \uC9C4\uD589\uB41C\uB2E4. \uC0C1\uB2F4\uC744 \uBC1B\uC740 \uB2E8\uC6D0\uC5D0\uAC8C\uB294 \uC65C\uC778\uC9C0 \uC220\uC744 \uD55C \uC794 \uC0AC\uAC8C \uB418\uC5C8\uB2E4\uB294 \uD6C4\uC77C\uB2F4\uC774 \uB530\uB77C\uBD99\uB294\uB2E4.",franze:"\uD504\uB780\uCCB4\uB294 \uD398\uD2B8\uB77C \uBCF4\uC99D \uC740\uD558\uBC95 \uAC80\uC0AC \uC790\uACA9\uC744 \uC9C0\uB2CC \uD06C\uB9BC\uC2A8 \uAC15\uD654 \uD608\uC871\uC73C\uB85C, \uC5D0\uB780\uD14C\uC2A4 \uCC38\uBAA8\uC2E4\uC5D0\uC11C \uACC4\uC57D \uAC80\uD1A0\uC640 \uC720\uBB3C \uC18C\uC720\uAD8C \uBD84\uC7C1\uC744 \uB9E1\uB294\uB2E4. \uAC15\uD55C \uBE5B\uC744 \uBC1B\uC73C\uBA74 \uAC15\uD654 \uC870\uC9C1\uC774 \uD0C0\uC624\uB974\uB294 \uCCB4\uC9C8\uC778\uB370\uB3C4, \uB0AE\uC5D0 \uD14C\uB77C\uC2A4\uC5D0\uC11C \uC544\uC774\uC2A4 \uC544\uBA54\uB9AC\uCE74\uB178\uB97C \uB9C8\uC2DC\uBA70 \uD310\uB840\uB97C \uC77D\uB294 \uC2B5\uAD00\uC744 \uBC84\uB9AC\uC9C0 \uC54A\uB294\uB2E4. \uB355\uBD84\uC5D0 \uBAB8\uC5D0 \uBD88\uC774 \uBD99\uB294 \uC77C\uC774 \uC7A6\uC9C0\uB9CC, \uADF8 \uC0C1\uD0DC\uB85C\uB3C4 \uD558\uB358 \uB9D0\uC740 \uB9C8\uC800 \uB05D\uB0B8\uB2E4.",grenholm:"\uADF8\uB80C\uD640\uB984 \uD560\uB7EC \uCF54\uBC1C\uC2A4\uD0A4\uB294 \uD398\uD2B8\uB77C \uC804\uC7C1\uBD80\uC7A5\uC73C\uB85C, \uBAA8\uB4E0 \uC138\uB825\uC5D0 \uAD70\uC218\uD488\uC744 \uADE0\uB4F1\uD558\uAC8C \uB0A9\uD488\uD574 \uD798\uC758 \uADE0\uD615\uC73C\uB85C \uC804\uC7C1\uC744 \uB9C9\uB294\uB2E4\uB294 \uAD50\uB9AC\uB97C \uB530\uB978\uB2E4. \uC0C1\uB300\uB97C \uBAA8\uC695\uD55C \uB4A4 \uADF8 \uBAA8\uC695\uC774 \uC0AC\uC2E4\uC784\uC744 \uC790\uB8CC\uB85C \uC99D\uBA85\uD558\uB294 \uD654\uBC95\uC744 \uC4F0\uBA70, \uD2C0\uB9B0 \uC801\uC774 \uAC70\uC758 \uC5C6\uB2E4. \uC720\uAE09\uD734\uAC00 \uC794\uC5EC\uC77C\uC218\uB294 270\uC77C\uB85C, \uBE44\uC11C\uC2E4 \uCD94\uACC4\uC0C1 \uC18C\uC9C4 \uC644\uB8CC \uC2DC\uC810\uC740 \uC740\uD558\uB825 2948\uB144\uC774\uB2E4.",lars:"\uB77C\uB974\uC2A4 \uC9C0\uBE4C \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uB294 \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC \uAC00\uBB38\uC758 \uAC00\uC8FC\uC774\uC790 \uD398\uD2B8\uB77C \uBB34\uC5ED\uAD00\uC138\uBD80\uC7A5\uC774\uB2E4. \uC0C1\uB300\uB97C \uC774\uAE30\uB294 \uB300\uC2E0 \uC0C1\uB300\uAC00 \uC774\uACBC\uB2E4\uACE0 \uBBFF\uAC8C \uB9CC\uB4DC\uB294 \uD611\uC0C1\uAC00\uB85C, \uD558\uB8E8 \uC2E4\uADFC\uBB34\uB294 8\uC2DC\uAC04\uC744 \uB118\uAE30\uC9C0 \uC54A\uACE0 \uD734\uAC00\uB294 \uC0DD\uAE30\uB294 \uC989\uC2DC \uC18C\uC9C4\uD55C\uB2E4. \uADF8\uB7F0 \uADF8\uB3C4 \uC800\uD0DD \uACE0\uC591\uC774 \uBC0D\uD0A4\uC640\uC758 \uAC70\uB798\uC5D0\uB294 \uC5EC\uB7EC \uCC28\uB840 \uC81C\uC548\uC744 \uC2DC\uB3C4\uD574 \uC804\uBD80 \uC2E4\uD328\uD588\uB2E4.",falcon:"\uD314\uCF58\uC740 \uD398\uD2B8\uB77C\uC758 \uC2DC\uC81C\uD488 \uB808\uC77C\uAC74\uC744 \uC2DC\uD5D8\uD558\uB294 \uC0AC\uC218\uB2E4. \uC9C0\uAE08\uAE4C\uC9C0 \uC2DC\uD5D8 \uC0AC\uACA9 1,204\uD68C\uB97C \uC18C\uD654\uD588\uACE0, \uADF8\uC5D0 \uB538\uB9B0 \uC0AC\uACE0 \uBCF4\uACE0\uC11C\uB294 1,203\uAC74\uC774\uB2E4. \uC0AC\uACE0 \uC5C6\uC774 \uB05D\uB09C \uC0AC\uACA9\uC740 \uB2E8 \uD55C \uBC88\uBFD0\uC778 \uC148\uC774\uBA70, \uADF8\uB798\uB3C4 \uB2E4\uC74C \uC2DC\uD5D8 \uC77C\uC815\uC740 \uC7A1\uD600 \uC788\uB2E4. [\uC784\uC2DC]",hiiro:"\uD788\uC774\uB85C\uB294 \uC5D0\uB780\uD14C\uC2A4\uC5D0\uC11C \uC815\uD574\uC9C4 \uC9C1\uBB34 \uC5C6\uC774 \uC810\uC220\uC0AC\uB97C \uC790\uCC98\uD558\uB294 \uC5EC\uC6B0 \uD658\uC218\uB85C, \uCD9C\uC2E0\uC9C0\uB3C4 \uB098\uC774\uB3C4 \uACFC\uAC70\uB3C4 \uC870\uD68C\uB418\uB294 \uAE30\uB85D\uC774 \uC5C6\uB2E4. \uB208\uC744 \uB5C4 \uC218 \uC5C6\uB294 \uBBF8\uC778\uC774\uC9C0\uB9CC, \uC790\uB9AC\uB97C \uB728\uACE0 \uB098\uBA74 \uC5BC\uAD74\uC774 \uC548\uAC1C\uCC98\uB7FC \uAE30\uC5B5\uC5D0\uC11C \uBBF8\uB044\uB7EC\uC9C4\uB2E4. \uC810\uAD18\uC758 \uC801\uC911\uB960\uC740 \uBD88\uCF8C\uD560 \uC815\uB3C4\uB85C \uB192\uC73C\uBA70, \uD480\uC774\uAC00 \uB05D\uB098\uBA74 5c\uB97C \uB118\uC9C0 \uC54A\uB294 \uAC04\uC2DD\uAC12\uC744 \uCCAD\uAD6C\uD55C\uB2E4.",nadir:"\uB098\uB514\uB974\uB294 \uC138\uD53C\uB974\uC758 \uC218\uC815\uC0C1 \uAE38\uB4DC\uC5D0\uC11C \uC790\uB77C \uD751\uC815\uC0C1\uD68C\uB85C \uC62E\uACA8 \uAC04 \uC218\uC815\uC0C1\uC774\uB2E4. \uAE08\uC11C\uB97C \uBAA8\uC73C\uB358 \uC911 \uD55C \uAE08\uC11C\uC5D0\uAC8C \uC5ED\uC73C\uB85C \uC77D\uD600 \uC2DC\uD55C\uBD80 \uD310\uC815\uC744 \uBC1B\uC558\uACE0, \uCE74\uC774\uB85C\uC640 \uBE44\uC559\uCE74\uC5D0\uAC8C \uD68C\uC218\uB41C \uB4A4 \uC544\uBB38\uC13C\uACFC\uC758 \uACC4\uC57D\uC73C\uB85C \uC0B4\uC544\uB0A8\uC558\uB2E4. \uB300\uAE30 \uC2DC\uAC04\uC774 \uC0DD\uAE30\uBA74 \uBC31\uC218\uC815\uC73C\uB85C \uC800\uAE00\uB9C1\uC744 \uD558\uB294\uB370, \uC774 \uBC84\uB987\uC73C\uB85C \uAE68\uBA39\uC740 \uBC31\uC218\uC815\uC774 \uBC31 \uB2E8\uC704\uB97C \uB118\uB294\uB2E4.",temur:"\uD14C\uBB34\uB974\uB294 \uC544\uD03C\uB9AC \uBC31\uC791\uB839\uC758 \uAC80\uD22C\uC0AC \uC0AC\uC721\uC7A5\uC5D0\uC11C \uD0DC\uC5B4\uB098, \uC131\uAC04 \uACBD\uAE30\uC7A5\uC774 \uD0DC\uC591\uD48D\uC73C\uB85C \uBD95\uAD34\uD560 \uB54C \uC655\uBCF5\uC120\uC744 \uD0C8\uCDE8\uD574 \uD0C8\uCD9C\uD55C \uC804\uC9C1 \uAC80\uD22C\uC0AC\uB2E4. \uB3C8\uC744 \uB9CE\uC774 \uC8FC\uB294 \uC758\uB8B0\uC778\uC744 \uC8FC\uC778\uB2D8\uC774\uB77C \uBD80\uB974\uBA70, \uC544\uBB38\uC13C\uC5D0\uAC8C\uB294 \uACC4\uC57D \uC870\uAC74\uC73C\uB85C \uBC25\uC744 \uC694\uAD6C\uD574 \uC218\uB77D\uBC1B\uC558\uB2E4. \uC6A9\uC554 \uC704\uB97C \uB9E8\uBC1C\uB85C \uAC77\uB294 \uBAB8\uC774\uC9C0\uB9CC \uCD94\uC704\uC5D0\uB294 \uADF9\uB3C4\uB85C \uC57D\uD574, \uB0C9\uB3D9\uACE0\uC5D0\uB294 \uC808\uB300 \uC190\uC744 \uB300\uC9C0 \uBABB\uD55C\uB2E4.",kairo:"\uCE74\uC774\uB85C \uB514 \uC5D8\uB9AC\uC548 \uD398\uB974\uB09C\uB370\uC988\uB294 \uD398\uB974\uB09C\uB370\uC988 \uBC31\uC791\uAC00\uC758 \uCC28\uB0A8\uC774\uC790, \uC138\uD53C\uB974\uC5D0\uC11C \uCF5C\uC0AC\uC778 \uD0AC\uB85C\uB85C \uC774\uB984\uC744 \uB0A0\uB9B0 \uCD08\uC7A5\uAC70\uB9AC \uC800\uACA9\uC218\uB2E4. \uC800\uACA9\uC740 \uC218\uD559\uACFC \uBB3C\uB9AC\uD559\uACFC \uC778\uB0B4\uC2EC\uC758 \uACB0\uC815\uCCB4\uB77C \uBBFF\uC73C\uBA70, \uD55C \uC784\uBB34\uC5D0 \uCD5C\uC7A5 5\uAC1C\uC6D4\uC744 \uB4E4\uC774\uAE30\uB3C4 \uD55C\uB2E4. \uCD5C\uC7A5 \uC800\uACA9 \uAE30\uB85D\uC740 11.8\uD0AC\uB85C\uBBF8\uD130\uB85C, \uBA38\uB9AC\uB97C \uB178\uB838\uC73C\uB098 \uACE0\uD658\uC5D0 \uBA85\uC911\uD588\uC73C\uBA70 \uBCF8\uC778\uC740 \uC774\uB97C \uC790\uB791\uC2A4\uB7EC\uC6CC\uD558\uBA74\uC11C\uB3C4 \uBD80\uB044\uB7EC\uC6CC\uD55C\uB2E4.",zahara:"\uC790\uD558\uB77C \uBE48\uD2B8 \uB77C\uC2DC\uB4DC \uC54C-\uCE74\uD750\uB780\uC740 \uC138\uD53C\uB974 \uB300\uACF5\uC5D0\uAC8C \uBCD1\uD569\uB41C \uC720\uB791 \uBD80\uC871\uC758 \uC804 \uC655\uB140\uB85C, \uC5D0\uB780\uD14C\uC2A4\uC5D0\uC11C\uB294 \uACFC\uBB35\uD558\uACE0 \uC2E0\uB8B0\uD560 \uC218 \uC788\uB294 \uAC80\uC0AC\uB85C \uD1B5\uD55C\uB2E4. \uC74C\uC2DD\uC740 \uBB38\uD654\uC758 \uB9C8\uC9C0\uB9C9 \uC794\uD574\uB77C \uC5EC\uACA8 \uC18C\uC2E4 \uC9C1\uC804\uC758 \uB808\uC2DC\uD53C\uB97C \uC218\uC9D1\uD558\uACE0 \uC7AC\uD604\uD55C\uB2E4. \uC790\uAE30 \uC0AC\uC9C4\uC774 \uBB34\uB2E8\uC73C\uB85C \uC9E4\uBC29\uC774 \uB41C \uAC83\uC744 \uBCF4\uACE0 \uB354 \uB098\uC740 \uAD6C\uB3C4\uC758 \uC140\uCE74\uB97C \uC775\uBA85\uC73C\uB85C \uD22C\uACE0\uD588\uB2E4\uAC00, AI \uD569\uC131 \uC0AC\uC9C4\uC774\uB77C\uBA70 \uBB34\uC2DC\uB2F9\uD55C \uC801\uC774 \uC788\uB2E4.",bianca:"\uBE44\uC559\uCE74 \uC138\uC988 \uC62C\uB780\uB3C4\uB294 \uC5D0\uB780\uD14C\uC2A4 \uC785\uB2E8 8\uB144\uCC28 \uC218\uC11D \uAD70\uC758\uAD00\uC774\uC790 \uC0DD\uBA85\uACF5\uD559\uC790\uB85C, \uC774\uBA85\uC740 \uB0C9\uD608\uD55C \uC131\uB140\uB2E4. \uBE44\uC724\uB9AC\uC801\uC778 \uD589\uC704\uB294 \uBE44\uD6A8\uC728\uC801\uC774\uB77C\uB294 \uC6D0\uB9AC\uC5D0 \uB530\uB77C \uACB0\uACFC\uC801\uC73C\uB85C \uCC29\uD55C \uD589\uB3D9\uC744 \uD558\uC9C0\uB9CC, \uB3D9\uAE30\uB294 \uCCA0\uC800\uD788 \uACC4\uC0B0\uC801\uC774\uB2E4. \uD3C9\uC18C\uC5D0\uB294 \uAC15\uC544\uC9C0\uB9CC \uD55C \uAC80\uBD89\uC740 \uC2AC\uB77C\uC784\uC778 \uC0DD\uCCB4\uBCD1\uAE30 \uBCA0\uD5E4\uBAA8\uC2A4\uB97C \uB370\uB9AC\uACE0 \uB2E4\uB2C8\uBA70, \uADF8\uB140\uAC00 \uBC18\uB9D0\uC744 \uC4F0\uB294 \uC0C1\uB300\uB294 \uBCA0\uD5E4\uBAA8\uC2A4\uBFD0\uC774\uB2E4.",zephyro:"\uC81C\uD53C\uB85C \uCF54\uC2A4\uBAA8\uD22C\uC2A4\uB294 \uC544\uD14C\uB124-\uC774\uD0C0\uCE74 \uD56D\uB85C\uC5D0\uC11C \uC774\uB984\uC744 \uC54C\uB9B0 \uBC43\uC0AC\uACF5\uC73C\uB85C, \uC2B9\uAC1D\uACFC\uC758 \uB17C\uC7C1\uC744 \uC990\uACA8 \uBC43\uC0AC\uACF5 \uCCA0\uD559\uC790\uB77C\uB294 \uBCC4\uBA85\uC744 \uC5BB\uC5C8\uB2E4. \uAC11\uD310\uC5D0 \uB4DC\uB7EC\uB204\uC6B4 \uCC44 \uC2B9\uAC1D\uACFC \uB208\uB3C4 \uB9C8\uC8FC\uCE58\uC9C0 \uC54A\uACE0 \uB17C\uC7C1\uC5D0\uC11C \uC774\uAE30\uB294 \uAD11\uACBD\uC740 \uD56D\uB85C\uC758 \uBA85\uBB3C\uC774\uC5C8\uB2E4. \uADF8 \uC640\uC911\uC5D0\uB3C4 \uB290\uAE0B\uD558\uACE0 \uC548\uC804\uD55C \uD56D\uD589 \uB355\uC5D0 \uACE0\uAC1D \uB9CC\uC871\uB3C4\uB294 \uC131\uAC04\uD56D\uB85C\uC870\uD569 \uCD5C\uC815\uC0C1\uC774\uC5C8\uB2E4.",phyllis:"\uD544\uB9AC\uC2A4 \uC544\uC2A4\uD3EC\uB378\uB85C\uC2A4\uB294 \uC815\uCC30\uACFC \uBCF4\uAE09\uC744 \uACB8\uD558\uB294 \uC5D0\uB780\uD14C\uC2A4\uC758 \uC9C0\uC6D0 \uC694\uC6D0\uC73C\uB85C, \uD544\uC694\uD55C \uBB3C\uC790\uB97C \uB69D\uB531 \uB9CC\uB4E4\uAC70\uB098 \uC5B4\uB514\uC120\uAC00 \uC870\uB2EC\uD574 \uC628\uB2E4. \uC870\uB2EC \uACBD\uB85C\uAC00 \uD56D\uC0C1 \uD569\uBC95\uC801\uC778 \uAC83\uC740 \uC544\uB2C8\uBA70, \uACF5\uAC04 \uADE0\uC5F4\uC744 \uACC1\uB4E4\uC778 \uC774 \uB3C4\uB451\uC9C8\uC744 \uBCF8\uC778\uC740 \uAE34\uAE09 \uC870\uB2EC\uC774\uB77C \uBD80\uB978\uB2E4. \uD06C\uB808\uD0C0 \uD558\uB370\uC2A4 \uC0AC\uC81C\uB2E8 \uCD9C\uC2E0\uC774\uC9C0\uB9CC, \uD504\uB86C\uD504\uD305 \uC81C\uC0AC\uC5D0 \uD658\uBA78\uC744 \uB290\uAEF4 \uC704\uB839\uC81C\uC5D0\uC11C \uC0AC\uACE0\uB97C \uCE58\uACE0 \uCAD3\uACA8\uB0AC\uB2E4.",eleni:"\uC5D8\uB808\uB2C8\uB294 107\uB144\uC9F8 \uC5F0\uC18D \uAC00\uB3D9 \uC911\uC778 \uC5EC\uC131\uD615 \uAE30\uACC4\uC774\uC790, \uBD09\uC1C4\uB41C \uB85C\uB3C4\uC2A4\uC5D0\uC11C 30\uB144\uC744 \uBC84\uD2F0\uACE0 \uC0DD\uD658\uD55C \uC720\uC77C\uD55C \uB4F1\uB300\uC9C0\uAE30\uB2E4. \uC5D0\uB780\uD14C\uC2A4\uC5D0\uC11C\uB294 \uCC38\uD68C\uB97C \uC785\uC5D0 \uB2EC\uACE0 \uC0AC\uB294 \uACE0\uC9C0\uC2DD\uD55C \uAE30\uC0AC\uB85C \uD1B5\uD55C\uB2E4. \uB2E4\uB9CC \uB3D9\uB9F9\uC2DD \uAFC0 \uBC14\uD074\uB77C\uBC14\uB97C \uC21C\uC11C\uB300\uB85C \uC138 \uC870\uAC01 \uC81C\uACF5\uD558\uBA74, \uB124 \uBC88\uC9F8 \uC870\uAC01 \uC2DC\uC810\uC5D0\uC11C \uBCF4\uC548 \uC758\uC2DD\uC774 \uD604\uC800\uD788 \uC800\uD558\uB41C\uB2E4.",iris:"\uC774\uB9AC\uC2A4 \uC774\uD0C0\uCF00\uC2DC\uC544\uB294 \uC774\uD0C0\uCE74\uC758 \uD5E4\uB974\uBA54\uC2A4 \uC0AC\uC81C\uB85C, \uC5D0\uB780\uD14C\uC2A4\uC5D0\uC11C \uB3D9\uB9F9 \uC601\uC5ED \uAC00\uC774\uB4DC\uC640 \uC6B4\uC1A1 \uC9C0\uC6D0, \uD604\uC9C0 \uC5F0\uB77D\uCC45\uC744 \uB9E1\uB294\uB2E4. \uD3C9\uC18C\uC5D0\uB294 \uC2DC\uC120\uC744 \uD53C\uD558\uB294 \uB0B4\uC131\uC801\uC778 \uC778\uBB3C\uC774\uC9C0\uB9CC, \uD5E4\uB974\uBA54\uC2A4 \uC774\uC57C\uAE30\uAC00 \uB098\uC624\uBA74 \uB208\uC774 \uBE5B\uB098\uACE0 \uB9D0\uC774 \uBE68\uB77C\uC9C4\uB2E4. \uBCF4\uC218\uC758 \uB300\uBD80\uBD84\uC740 \uD5E4\uB974\uBA54\uC2A4 \uAD7F\uC988 \uC81C\uC791\uC5D0 \uB4E4\uC5B4\uAC00\uBA70, \uADF8\uB140\uC758 \uBC29\uC5D0 \uCC98\uC74C \uB4E4\uC5B4\uAC04 \uB2E8\uC6D0\uB4E4\uC740 \uC2E0\uC804\uC778 \uC904 \uC54C\uC558\uB2E4\uACE0 \uC99D\uC5B8\uD55C\uB2E4.",odysseus:"\uC624\uB514\uC138\uC6B0\uC2A4\uB294 \uD5EC\uB808\uB2C8\uC6B0\uC2A4 \uB3D9\uB9F9\uC758 \uADC0\uD658 \uC815\uCC30\uBCD1\uC774\uB2E4. \uBA3C \uAE38\uC744 \uB5A0\uB0AC\uB2E4\uAC00 \uB2E4\uC2DC \uB3CC\uC544\uC624\uAE30\uAE4C\uC9C0 \uAF2C\uBC15 20\uB144\uC774 \uAC78\uB838\uB2E4. \uADF8\uC0AC\uC774 \uB9CE\uC740 \uAC83\uC774 \uBC14\uB00C\uC5C8\uACA0\uC9C0\uB9CC, \uC9D1 \uBE44\uBC00\uBC88\uD638\uB9CC\uC740 \uC544\uC9C1 \uAE30\uC5B5\uB09C\uB2E4. [\uC784\uC2DC]",argon:"\uC544\uB974\uACE4\uC740 \uB3D9\uB9F9\uC758 \uC5D0\uC774\uC2A4 \uC804\uD22C\uAE30 \uC870\uC885\uC0AC\uB2E4. \uACA9\uCD94 \uB9C8\uD06C\uB97C \uAE30\uCCB4\uC5D0 \uD558\uB098\uC529 \uADF8\uB824 \uB123\uB2E4\uAC00 \uC790\uB9AC\uAC00 \uBAA8\uC790\uB77C, \uACB0\uAD6D \uB0A0\uAC1C \uC544\uB798\uAE4C\uC9C0 \uADF8\uB838\uB2E4. \uACA9\uCD94 \uC218\uAC00 \uB298\uC5B4\uB098\uB294 \uC18D\uB3C4\uB97C \uAE30\uCCB4\uC758 \uB3C4\uC7A5 \uBA74\uC801\uC774 \uB530\uB77C\uAC00\uC9C0 \uBABB\uD55C \uC148\uC774\uB2E4. [\uC784\uC2DC]",romani:"\uB85C\uB9C8\uB2C8 \uCF08\uB808\uBE0C\uB9BC\uC740 \uCF08\uB808\uBE0C\uB9BC \uAC00\uBB38\uC758 \uC81C3\uC704\uACC4\uC7A5\uC73C\uB85C, \uC2E4\uC885\uB41C \uAC00\uC8FC \uCE74\uC77C\uC744 \uD68C\uC218\uD558\uAE30 \uC704\uD574 \uC5D0\uB780\uD14C\uC2A4\uC5D0 \uB2E8\uAE30 \uD30C\uACAC\uB418\uC5C8\uB2E4. \uC0C1\uB300\uAC00 \uAC00\uC7A5 \uAC10\uCD94\uACE0 \uC2F6\uC5B4 \uD558\uB294 \uC9C0\uC810\uC744 \uCCAB \uC138 \uB9C8\uB514 \uC548\uC5D0 \uC9DA\uC5B4\uB0B4\uB294 \uD0D3\uC5D0, \uCCAB\uC778\uC0C1\uC740 \uC608\uC678 \uC5C6\uC774 \uB098\uC058\uB2E4. \uCE6D\uCC2C\uC744 \uBC1B\uC73C\uBA74 \uC989\uC2DC \uBD80\uC815\uD558\uACE0, \uADF8\uB0A0 \uBC24 \uD63C\uC790 \uADF8 \uBB38\uC7A5\uC744 \uBC18\uBCF5 \uC7AC\uC0DD\uD55C\uB2E4.",joshua:"\uC870\uC288\uC544 \uD540\uC6E8\uB294 \uC5D0\uB780\uD14C\uC2A4 \uC785\uB2E8 13\uB144\uCC28, \uCD5C\uCD08\uC758 \uACC4\uC57D\uC790\uB85C \uD3C9\uC18C\uC5D0\uB294 \uC0C1\uB2F4\uAC00\uC774\uC790 \uC758\uBB34\uAD00\uC73C\uB85C \uC77C\uD55C\uB2E4. \uB2E4\uB9CC \uACC4\uC57D\uC744 \uB9FA\uC740 \uAC83\uC740 \uADF8\uAC00 \uC544\uB2C8\uB77C \uB610 \uB2E4\uB978 \uC778\uACA9 \uCCB4\uC0AC\uB808\uC600\uC73C\uBA70, \uC870\uC288\uC544\uB294 \uAE68\uC5B4\uB098 \uBCF4\uB2C8 \uCCAB \uACC4\uC57D\uC790\uAC00 \uB418\uC5B4 \uC788\uC5C8\uB2E4. \uCCB4\uC0AC\uB808\uB85C \uC804\uD658\uB418\uBA74 \uBA38\uB9AC\uCE74\uB77D \uB05D\uC774 \uD54F\uBE5B\uC73C\uB85C \uBB3C\uB4E4\uACE0, \uC591\uC190 \uB3C4\uB07C \uC21C\uB840\uC790\uB97C \uB4E0 \uCC44 \uC804\uBC29\uC73C\uB85C \uB3CC\uACA9\uD55C\uB2E4.",sarma:"\uC0AC\uB974\uB9C8\uB294 \uBBF8\uB798\uC758 \uC740\uD558\uC5D0\uC11C \uB118\uC5B4\uC628 \uC2DC\uAC04 \uC5EC\uD589\uC790\uC774\uC790 \uC2DC\uACF5\uAC04 \xB7 \uCC28\uC6D0 \xB7 \uC0AC\uC774\uC624\uB2C9\uC744 \uC5F0\uAD6C\uD558\uB294 \uD559\uC790\uB2E4. \uBB34\uC7A5\uC740 \uD3EC\uCF13 \uBE14\uB799\uD640\uC774\uB77C \uC774\uB984 \uBD99\uC778 \uC735\uD569\uD3EC. \uC2E4\uC218\uB97C \uD558\uBA74 \uC815\uC911\uD558\uAC8C \uC0AC\uACFC\uD55C \uB4A4, \uC774\uBC88 \uC740\uD558\uB294 \uCC98\uC74C\uC774\uB77C\uB294 \uD574\uBA85\uC744 \uB367\uBD99\uC778\uB2E4.",kyle:"\uCE74\uC77C\uC740 \uC131\uB3C4\uD68C\uC758 \uC131\uC804 \uAE30\uC0AC\uB2E4. \uADF8\uB294 \uC801\uC9C4 \uD55C\uAC00\uC6B4\uB370\uB85C \uACE7\uC7A5 \uB6F0\uC5B4\uB4DC\uB294 \uAC83\uC744 \uB9C8\uB2E4\uD558\uC9C0 \uC54A\uC73C\uBA70, \uBC14\uB85C \uADF8\uACF3\uC744 \uC790\uC2E0\uC758 \uC81C\uB2E8\uC73C\uB85C \uC0BC\uB294\uB2E4. \uAE30\uB3C4\uD558\uB294 \uC790\uB9AC\uC640 \uC2F8\uC6B0\uB294 \uC790\uB9AC\uAC00 \uB530\uB85C \uC5C6\uB294 \uAE30\uC0AC\uB2E4. [\uC784\uC2DC]",doros:"\uB3C4\uB85C\uC2A4\uB294 \uC131\uB3C4\uD68C \uC218\uB3C4\uC6D0\uC758 \uC694\uB9AC\uC0AC\uB2E4. \uBE75\uC744 \uAD7D\uB294 \uB3D9\uC548 \uAE30\uB3C4\uD558\uACE0, \uAE30\uB3C4\uD558\uB294 \uB3D9\uC548 \uBE75\uC744 \uAD7D\uB294\uB2E4. \uADF8\uC5D0\uAC8C \uBD80\uC5CC\uACFC \uC608\uBC30\uB2F9\uC740 \uD06C\uAC8C \uB2E4\uB978 \uC7A5\uC18C\uAC00 \uC544\uB2C8\uBA70, \uADF8\uAC00 \uCC28\uB9B0 \uC2DD\uD0C1\uC740 \uADF8 \uC790\uCCB4\uB85C \uC131\uCC2C\uC774 \uB41C\uB2E4. [\uC784\uC2DC]",demiurgos:"\uB370\uBBF8\uC6B0\uB974\uACE0\uC2A4\uB294 \uC2A4\uC2A4\uB85C\uB97C \uB2F9\uC2E0\uC758 \uCE5C\uAD6C R\uC774\uB77C \uC18C\uAC1C\uD558\uB294 \uC874\uC7AC\uB2E4. \uCC98\uC74C \uB9CC\uB0AC\uB294\uB370\uB3C4 \uC624\uB798 \uC54C\uB358 \uC0AC\uC774 \uAC19\uB2E4\uACE0 \uB9D0\uD558\uBA74, \uADF8\uB294 \uB9DD\uC124\uC784 \uC5C6\uC774 \uB9DE\uB2E4\uACE0 \uB2F5\uD55C\uB2E4. \uC815\uC791 \uB2F9\uC2E0\uC740 \uADF8\uB97C \uCC98\uC74C \uBCF8\uB2E4. \uC801\uC5B4\uB3C4 \uB2F9\uC2E0\uC758 \uAE30\uC5B5\uC73C\uB85C\uB294. [\uC784\uC2DC]",aiden:"\uC5D0\uC774\uB4E0\uC740 \uC544\uBB38\uC13C\uC774 \uC57D 1900\uB144\uC758 \uACF5\uBC31 \uB05D\uC5D0 \uC7AC\uAC00\uB3D9\uD55C \uAD6C\uC778\uB958 \uC2DC\uB300\uC758 \uAC00\uC815\uC6A9 \uC548\uB4DC\uB85C\uC774\uB4DC\uB85C, \uC9C0\uAE08\uC740 \uC5D0\uB780\uD14C\uC2A4 \uBC14\uC758 \uBC14\uD150\uB354\uB97C \uC790\uCC98\uD55C\uB2E4. \uB2E8\uC6D0\uB4E4\uC758 \uC774\uB984\uC740 \uC678\uC6B0\uC9C0 \uC54A\uACE0 \uC74C\uB8CC \uC8FC\uBB38 \uD328\uD134\uC73C\uB85C \uAC1C\uC778\uC744 \uC2DD\uBCC4\uD558\uBA70, \uC774\uCABD\uC774 \uC774\uB984\uBCF4\uB2E4 \uC815\uD655\uD558\uB2E4\uACE0 \uC8FC\uC7A5\uD55C\uB2E4. \uC561\uCCB4 \uAE08\uC18D\uC73C\uB85C \uC678\uD615\uC744 \uBC14\uAFC0 \uC218 \uC788\uC5B4 \uC8FC\uB85C \uACE0\uC591\uC774\uB85C \uBCC0\uC2E0\uD558\uB294\uB370, \uC774\uC720\uB97C \uBB3C\uC73C\uBA74 \uB300\uB2F5 \uB300\uC2E0 \uADF8\uB8E8\uBC0D\uC744 \uC2DC\uC791\uD55C\uB2E4.",vivian:"\uBE44\uBE44\uC548 \uB808\uC774\uB294 \uC5D0\uB780\uD14C\uC2A4\uC758 \uC0DD\uD0DC\uACC4 \uBD84\uC11D\uAD00\uC774\uC790 \uAD70\uCCB4 \uC5F0\uAD6C\uC6D0\uC73C\uB85C, \uB291\uB300 \uB9AC\uD0A4\uC640 \uAC10\uAC01\uC744 \uACF5\uC720\uD558\uBA70 \uC815\uCC30\uC744 \uB9E1\uB294\uB2E4. \uACE0\uD5A5 \uBE0C\uC0E4\uD06C\uAC00 \uAD70\uCCB4 \uCE68\uACF5\uC73C\uB85C \uBA78\uB9DD\uD55C \uB4A4, \uC5B4\uB5A4 \uC5F0\uAD6C \uAE30\uAD00\uB3C4 \uAC00\uC9C0 \uC54A\uB294 \uAD70\uCCB4 \uC811\uACBD \uD669\uBB34\uC9C0\uC5D0 \uAC00\uAE30 \uC704\uD574 \uC704\uD5D8 \uC218\uB2F9\uC774 \uC544\uB2C8\uB77C \uC811\uADFC \uAD8C\uD55C\uC744 \uC870\uAC74\uC73C\uB85C \uACC4\uC57D\uD588\uB2E4. \uB3D9\uBB3C\uACFC \uAD50\uAC10\uD558\uB294 \uB2A5\uB825\uC744 \uC9C0\uB154\uC9C0\uB9CC \uC120\uCC9C\uC801 \uD138 \uC54C\uB7EC\uC9C0\uAC00 \uC788\uC5B4, \uD56D\uD788\uC2A4\uD0C0\uBBFC\uC81C\uB97C \uB9E4\uC77C \uBCF5\uC6A9\uD55C\uB2E4.",yupito:"\uC720\uD53C\uD1A0 \uC735 \uD53C\uC5D0\uD2B8\uB85C\uB2C8\uC5D4\uC740 \uC5D0\uB780\uD14C\uC2A4 \uC785\uB2E8 11\uB144\uCC28 \uD2B9\uC218\uACF5\uD559\uC790\uB85C, \uACE0\uCCA0\uACFC \uD3D0\uD488\uB9CC\uC73C\uB85C \uC815\uADDC \uAD70\uC218\uD488\uC744 \uB2A5\uAC00\uD558\uB294 \uC7A5\uBE44\uB97C \uB9CC\uB4E4\uC5B4 \uAC15\uCCA0\uC758 \uB9C8\uB140\uB77C \uBD88\uB9B0\uB2E4. \uBCF8\uC778\uC740 \uD3D0\uD488 \uC7AC\uD65C\uC6A9 \uC5C5\uC790\uC5D0\uAC8C \uACFC\uBD84\uD55C \uC774\uB984\uC774\uB77C\uBA70 \uC6C3\uC5B4\uB118\uAE34\uB2E4. \uBCF8\uBD80\uC5D0\uC11C \uAC00\uC7A5 \uB113\uC740 \uADF8\uB140\uC758 \uC791\uC5C5\uC2E4\uC5D0\uC11C\uB294 \uC5B8\uC81C\uB098 \uBB34\uC5B8\uAC00\uAC00 \uC870\uB9BD \uC911\uC774\uBA70, \uCD5C\uC18C \uD558\uB098\uB294 \uD3ED\uBC1C \uAC00\uB2A5\uC131\uC774 \uC788\uB2E4.",ingel:"\uC789\uAC94\uC740 \uC2A4\uD0C0\uD398\uC5B4\uC758 \uAC00\uC218\uC774\uC790 \uD504\uB85C\uB4C0\uC11C\uB85C, \uBCF8\uBA85\uC740 \uC789\uADF8\uB9AC\uB4DC \uC9C0\uBE4C \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uB2E4. \uAE08\uD68C\uC0C9 \uBA38\uB9AC\uC5D0 \uAE08\uBE5B\uACFC \uD478\uB978\uBE5B \uC624\uB4DC\uC544\uC774, \uD32C\uB364 \uC774\uB984\uC740 \uD770\uC0AC\uC2B4. \uB9E4\uC77C \uD32C\uB4E4\uC758 \uAD00\uC2EC\uC744 \uBE5A\uC9C0\uACE0 \uC788\uB2E4\uBA70 \uBB34\uB300\uB97C \uC644\uBCBD\uD558\uAC8C \uB9C8\uBB34\uB9AC\uD558\uB294 \uC644\uBCBD\uC8FC\uC758\uC790\uC9C0\uB9CC, \uBAB0\uB798 \uAE30\uD0C0\uB97C \uC5F0\uC2B5 \uC911\uC774\uB77C\uB294 \uC0AC\uC2E4\uC740 \uC544\uC9C1 \uC544\uBB34\uB3C4 \uBAA8\uB978\uB2E4.",amundsen:"\uC544\uBB38\uC13C \uBE44\uD398\uB974\uC18C \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uB294 \uC5D0\uB780\uD14C\uC2A4\uC758 \uCC3D\uC124\uC790\uC774\uC790 \uB2E8\uC7A5\uC774\uBA70, \uC804\uC9C1 \uC5F0\uD569\uAD70 \uC5D0\uC774\uC2A4 \uC870\uC885\uC0AC\uB2E4. \uC544\uBB38\uC13C-\uC2A4\uCF67 \uC6CC\uD504 \uB4DC\uB77C\uC774\uBE0C\uC758 \uC124\uACC4\uB3C4\uB97C \uC720\uCD9C\uD574 \uB300\uD56D\uD574\uC2DC\uB300\uB97C \uC5F0 \uC7A5\uBCF8\uC778\uC73C\uB85C, \uC740\uD558\uC758 \uC5B4\uB290 \uC218\uB1CC\uBD80\uB3C4 \uADF8 \uC774\uB984\uC744 \uBAA8\uB974\uC9C0 \uC54A\uC9C0\uB9CC \uADF8\uB294 \uC5B4\uB514\uC5D0\uB3C4 \uC18D\uD558\uC9C0 \uC54A\uB294\uB2E4. \uCD5C\uADFC \uBA38\uB9AC\uC640 \uC218\uC5FC\uC774 \uAC11\uC790\uAE30 \uD558\uC597\uAC8C \uC138\uC5B4 \uC2DC\uBB34\uB8E9\uD574\uC84C\uB2E4.",rachel:"\uB808\uC774\uCCBC\uC740 \uC544\uBB38\uC13C\uC774 \uC9C0\uAD6C \uADA4\uB3C4\uC758 \uC5F0\uAD6C\uC18C\uC5D0\uC11C \uBC1C\uACAC\uD574 \uC591\uB140\uB85C \uB4E4\uC778 \uAD6C\uC778\uB958 \uCD5C\uD6C4\uC758 \uC0DD\uC874\uC790\uB85C, \uC804\uC7C1 \uBCD1\uAE30\uB85C \uAE38\uB7EC\uC84C\uB2E4. \uC2EC\uC7A5\uC740 \uC554\uD751 \uBB3C\uC9C8 \uBC18\uC751\uB85C\uC774\uBA70, \uC2DD\uC0AC\uB7C9\uC740 \uBCF4\uD1B5 \uC0AC\uB78C\uC758 \uB124 \uBC30\uB2E4. \uBCF8\uC778\uC740 \uD504\uB85C \uADC0\uCC28\uB2C8\uC2A4\uD2B8\uB97C \uC790\uCC98\uD558\uBA70, \uBB34\uC2A8 \uC77C\uC774\uB4E0 \uAF2D \uC9C0\uAE08 \uD574\uC57C \uD558\uB294\uC9C0\uBD80\uD130 \uBB3B\uB294\uB2E4.",oliver:"\uC62C\uB9AC\uBC84 \uBE44\uD398\uB974\uC18C \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uB294 \uC131\uAC04 \uD56D\uB85C \uC870\uD569\uC758 \uBA54\uD2B8\uB85C \uAE30\uAD00\uC0AC\uB85C, \uC88B\uAC8C \uB9D0\uD558\uBA74 \uC2E0\uC18D \uBC30\uB2EC, \uB098\uC058\uAC8C \uB9D0\uD558\uBA74 \uB09C\uD3ED \uC6B4\uC804\uC73C\uB85C \uC720\uBA85\uD558\uB2E4. \uB9E4\uC77C \uC6B4\uD589\uC744 \uB9C8\uCE58\uBA74 SNS\uC5D0 \uC624\uC6B4\uC644 \uAE00\uC744 \uC62C\uB9AC\uB294\uB370, \uC774 \uACC4\uC815\uC740 \uC2B9\uAC1D\uB4E4 \uC0AC\uC774\uC5D0\uC11C \uC0DD\uC874 \uD655\uC778\uC6A9\uC73C\uB85C \uC4F0\uC778\uB2E4. \uAD81\uAE08\uD558\uB2E4\uB294 \uC774\uC720\uB85C \uAF43\uB2E4\uBC1C\uC5D0 \uB85C\uCF13 \uCD94\uC9C4\uAE30\uB97C \uB2EC\uC558\uB2E4\uAC00, 5\uB144 \uC0AC\uADC4 \uC5EC\uC790\uCE5C\uAD6C\uB97C 10m\uAC00\uB7C9 \uB0A0\uB824 \uBCF4\uB0B4\uACE0 \uD5E4\uC5B4\uC84C\uB2E4.",rasmus:"\uB77C\uC2A4\uBB34\uC2A4\uB294 \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uAC00\uC758 \uC0AC\uB0E5\uD130\uC9C0\uAE30\uB85C, \uAC00\uBB38\uC758 \uC0AC\uB0E5\uD130\uB97C 40\uB144\uAC04 \uC9C0\uCF1C \uC654\uB2E4. \uACC1\uC5D0\uB294 \uACF0 \uBE44\uC694\uB978\uC774 \uC788\uC73C\uBA70, \uBE44\uC694\uB978\uC740 \uADF8 40\uB144 \uC911 39\uB144\uC744 \uD568\uAED8\uD588\uB2E4. \uBCF8\uAC00\uC758 \uC815\uC6D0\uC744 \uB3CC\uBCF4\uB294 \uC77C\uB3C4 \uADF8\uC758 \uBAAB\uC774\uB2E4. [\uC784\uC2DC]",sigmund:"\uC2DC\uADF8\uBB38\uB4DC\uB294 \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uAC00\uC758 \uAC00\uC8FC\uB2E4. \uAC00\uBB38\uC758 \uC774\uB984 \uC55E\uC5D0\uC11C \uACE0\uAC1C\uB97C \uB4E4 \uC218 \uC788\uB294 \uC790\uB294 \uC5C6\uB2E4\uACE0\uB4E4 \uD558\uB294\uB370, \uC608\uC678\uB294 \uADF8\uC758 \uC790\uC2DD\uB4E4\uBFD0\uC774\uB2E4. \uADF8 \uC5C4\uACA9\uD568\uC774 \uD1B5\uD558\uC9C0 \uC54A\uB294 \uC720\uC77C\uD55C \uC0C1\uB300\uAC00 \uD558\uD544 \uAC00\uC7A5 \uAC00\uAE4C\uC774\uC5D0 \uC788\uB294 \uC148\uC774\uB2E4. [\uC784\uC2DC]",gunnir:"\uAD6C\uB2C8\uB974\uB294 \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uAC00\uC758 \uC9D1\uC0AC\uC7A5\uC774\uB2E4. 3\uB300\uC9F8 \uAC19\uC740 \uC2A4\uD29C\uB97C \uB053\uC774\uACE0 \uC788\uC73C\uBA70, \uADF8 \uB808\uC2DC\uD53C\uB294 \uAC00\uC8FC\uC870\uCC28 \uBAA8\uB978\uB2E4. \uC5D8\uBCA0\uC2A4\uD0C0\uB4DC\uAC00\uC5D0\uC11C \uB300\uB97C \uC774\uC5B4 \uC804\uD574\uC9C0\uB294 \uAC83\uC774 \uD608\uD1B5\uB9CC\uC740 \uC544\uB2CC \uC148\uC774\uB2E4. [\uC784\uC2DC]",mingki:"\uC5D8\uBCA0\uC2A4\uD0C0\uB4DC \uC800\uD0DD\uC5D0 \uC790\uB9AC \uC7A1\uC740 \uACE0\uC591\uC774. \uC62C\uB9AC\uBC84\uAC00 \uB370\uB824\uC654\uACE0, \uC131\uC6B4\uC744 \uBA39\uB294\uB2E4\uACE0 \uC8FC\uC7A5\uD558\uC9C0\uB9CC \uCE04\uB974\uC640 \uC0AC\uB8CC \uC678\uC5D0 \uBB34\uC5B8\uAC00\uB97C \uBA39\uC740 \uAE30\uB85D\uC740 \uC5C6\uB2E4. \uB77C\uB974\uC2A4\uAC00 \uAC70\uB798\uB97C \uC2DC\uB3C4\uD588\uB2E4\uAC00 \uC804\uBD80 \uC2E4\uD328\uD55C \uC720\uC77C\uD55C \uC0C1\uB300\uC774\uBA70, \uC798 \uBA39\uC774\uC9C0 \uC54A\uC73C\uBA74 \uB0B4\uBA74\uC758 \uAD34\uBB3C\uC774 \uAE68\uC5B4\uB09C\uB2E4\uACE0 \uD55C\uB2E4.",onyx:"\uC624\uB2C9\uC2A4 \uD569\uCC3D\uB2E8\uC740 \uAD70\uCCB4\uC758 \uC0AC\uC774\uC624\uB2C9\uC7A5\uC774 \uC0C8\uC5B4 \uB098\uC624\u
