<title>마스크 붓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  마스크 붓 (tools/mask-paint.html · 사용법 tools/mask-paint.md)
  어려운 투명화(배경 오리기 · 종이 지우기 · 층 나누기)를 사람이 붓으로 칠해 마스크를 만들고, 아티팩트 저장소(db)에 저장한다.
  Claude 는 ArtifactData 로 masks/<name> 문서를 읽어 scripts/mask_apply.py 로 원본에 적용한다.
  작업마다 바꾸는 곳: 아래 <script id="cfg"> 의 JSON (원본 파일 이름 · 문서 이름 · 층 이름).
-->
<script type="application/json" id="cfg">
{
  "name": "hand",
  "src": "hand_src.webp",
  "layers": [
    { "key": "hand", "label": "손 (남길 곳)", "color": "#4fd1c5", "keep": true },
    { "key": "thumb", "label": "엄지 (영수증 밑)", "color": "#f2a33a" }
  ]
}
</script>
<style>
/* 레이아웃: 위 = 층 · 보기 · 저장, 가운데 = 화면을 채운 그림판, 아래 = 엄지 닿는 곳에 도구 · 붓 · 크기. 어두운 작업실 한 가지 모습 */
:root {
  --bg: #15171b; --panel: #1f2228; --line: #353a44; --fg: #e8e6e1; --fg-2: #9aa0aa;
  --accent: #4fd1c5; --accent-ink: #0d1f1d; --ok: #63d297; --bad: #ff6b5e; --focus: #f2a33a;
  --f-ui: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  --f-num: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--f-ui); display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--panel); }
.top { border-bottom: 1px solid var(--line); }
.bottom { border-top: 1px solid var(--line); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.bar h1 { margin: 0; font-size: 15px; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; color: var(--fg-2); font: inherit; min-height: 36px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 600; }
.seg i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.btn { border: 1px solid var(--line); background: none; color: var(--fg); font: inherit; min-height: 36px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
:is(.btn, .seg button, canvas, input):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.size { display: inline-flex; align-items: center; gap: 8px; color: var(--fg-2); flex: 1 1 160px; min-width: 140px; }
.size input { flex: 1 1 auto; min-width: 80px; accent-color: var(--accent); }
.grow { flex: 1 1 auto; }
.stat { font: 12px var(--f-num); color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b { color: var(--fg); font-weight: 600; }
#msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
canvas.move { cursor: grab; }
@media (max-width: 640px) { .bar h1, .wide { display: none; } .seg button { padding: 6px 10px; } }
</style>

<header class="bar top">
  <h1 id="ttl">마스크 붓</h1>
  <div class="seg" role="group" aria-label="칠할 층" id="layers"></div>
  <div class="seg" role="group" aria-label="보기">
    <button id="v-edit" aria-pressed="true">편집</button>
    <button id="v-in" aria-pressed="false">칠한 곳만</button>
    <button id="v-out" aria-pressed="false">나머지만</button>
  </div>
  <span class="grow"></span>
  <span class="stat" id="msg">불러오는 중</span>
  <button class="btn wide" id="b-png" title="지금 층으로 오린 PNG 를 내려받기" hidden>PNG</button>
  <button class="btn primary" id="b-save">저장</button>
</header>
<main class="stage"><canvas id="cv" tabindex="0" aria-label="그림 위에 마스크를 붓으로 칠하는 판"></canvas></main>
<footer class="bar bottom">
  <div class="seg" role="group" aria-label="도구">
    <button id="t-brush" aria-pressed="true">붓</button>
    <button id="t-move" aria-pressed="false">이동 · 확대</button>
  </div>
  <div class="seg" role="group" aria-label="붓">
    <button id="m-add" aria-pressed="true">칠하기</button>
    <button id="m-del" aria-pressed="false">지우기</button>
  </div>
  <label class="size" for="sz">크기 <input id="sz" type="range" min="2" max="240" value="40"><span class="stat"><b id="szv">40</b></span></label>
  <button class="btn" id="b-undo">되돌리기</button>
  <button class="btn" id="b-fit">맞추기</button>
  <button class="btn" id="b-bg" title="칠한 곳만 · 나머지만 볼 때의 바탕">바탕 어둡게</button>
  <span class="stat wide"><b id="zoom">100</b>%</span>
</footer>

<script>
(() => {
  const CFG = JSON.parse(document.getElementById('cfg').textContent);
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), g = cv.getContext('2d');
  const img = new Image(); img.src = CFG.src;
  let W = 1, H = 1, db = null, dl = null, dpr = 1, ready = false;
  const BGS = [['어둡게', '#202329'], ['밝게', '#e9e6df'], ['나무', '#3a2418']];
  const st = { layer: CFG.layers[0].key, tool: 'brush', mode: 'add', view: 'edit', size: 40, bg: 0, s: 1, ox: 0, oy: 0, hist: [], cur: null };
  const keepKey = (CFG.layers.find((l) => l.keep) || CFG.layers[0]).key;
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  let mask = {}, shade, tint = {}, iso, before;

  // 층 단추
  const lay = $('layers');
  CFG.layers.forEach((l, i) => {
    const b = document.createElement('button');
    b.id = 'l-' + l.key; b.setAttribute('aria-pressed', i === 0); b.innerHTML = `<i style="background:${l.color}"></i>`; b.append(l.label);
    b.onclick = () => setLayer(l.key); lay.append(b);
  });

  // ── 합성 캐시
  function rebuild(k) {
    if (!shade) return;
    if (!k || k === keepKey) {
      const s = shade.getContext('2d'); s.globalCompositeOperation = 'source-over'; s.clearRect(0, 0, W, H);
      s.fillStyle = 'rgba(8,10,14,.62)'; s.fillRect(0, 0, W, H); s.globalCompositeOperation = 'destination-out'; s.drawImage(mask[keepKey], 0, 0);
    }
    for (const l of CFG.layers) {
      if (l.key === keepKey || (k && k !== l.key)) continue;
      const t = tint[l.key].getContext('2d'); t.globalCompositeOperation = 'source-over'; t.clearRect(0, 0, W, H);
      t.drawImage(mask[l.key], 0, 0); t.globalCompositeOperation = 'source-in'; t.fillStyle = l.color; t.fillRect(0, 0, W, H);
    }
    if (st.view !== 'edit') {
      const c = iso.getContext('2d'); c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, W, H);
      c.drawImage(img, 0, 0); c.globalCompositeOperation = st.view === 'in' ? 'destination-in' : 'destination-out'; c.drawImage(mask[st.layer], 0, 0);
    }
  }

  function size() { dpr = window.devicePixelRatio || 1; const r = cv.getBoundingClientRect(); cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr)); draw(); }
  function fit() { const r = cv.getBoundingClientRect(); st.s = Math.min(r.width / W, r.height / H) * 0.96; st.ox = (r.width - W * st.s) / 2; st.oy = (r.height - H * st.s) / 2; zoomTxt(); draw(); }
  const zoomTxt = () => { $('zoom').textContent = Math.round(st.s * 100); };
  const toImg = (x, y) => [(x - st.ox) / st.s, (y - st.oy) / st.s];

  function draw() {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = cv.getBoundingClientRect(); g.clearRect(0, 0, r.width, r.height);
    if (!img.naturalWidth || !shade) return;
    const x = st.ox, y = st.oy, w = W * st.s, h = H * st.s;
    g.imageSmoothingEnabled = st.s < 2;
    if (st.view === 'edit') {
      g.drawImage(img, x, y, w, h); g.drawImage(shade, x, y, w, h);
      for (const l of CFG.layers) if (l.key !== keepKey) { g.globalAlpha = st.layer === l.key ? 0.5 : 0.3; g.drawImage(tint[l.key], x, y, w, h); g.globalAlpha = 1; }
    } else { g.fillStyle = BGS[st.bg][1]; g.fillRect(x, y, w, h); g.drawImage(iso, x, y, w, h); }
    if (st.cur && st.tool === 'brush') {
      const [mx, my] = st.cur, rad = Math.max(1.5, st.size / 2 * st.s), lc = CFG.layers.find((l) => l.key === st.layer).color;
      g.beginPath(); g.arc(mx, my, rad, 0, Math.PI * 2);
      g.lineWidth = 2; g.strokeStyle = '#000'; g.stroke(); g.lineWidth = 1; g.strokeStyle = st.mode === 'add' ? lc : '#fff'; g.setLineDash(st.mode === 'add' ? [] : [4, 3]); g.stroke(); g.setLineDash([]);
    }
  }
  function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'stat' + (cls ? ' ' + cls : ''); }

  // ── 붓: 한 획 = 되돌리기 한 칸 (획이 지나간 사각형만 기억)
  function dab(ctx, ax, ay, bx, by, erase) {
    ctx.save(); ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = st.size;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx, by, st.size / 2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  const grow = (bb, x, y) => { const r = st.size / 2 + 2; bb[0] = Math.min(bb[0], x - r); bb[1] = Math.min(bb[1], y - r); bb[2] = Math.max(bb[2], x + r); bb[3] = Math.max(bb[3], y + r); };
  let stroke = null, gest = null, space = false;
  const ptrs = new Map();
  function cancelStroke() { if (!stroke) return; const c = mask[stroke.layer].getContext('2d'); c.clearRect(0, 0, W, H); c.drawImage(before, 0, 0); rebuild(stroke.layer); stroke = null; }
  function startGesture() {
    const p = [...ptrs.values()];
    if (p.length >= 2) { const [a, b] = p; gest = { pinch: true, d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: [(a.x + b.x) / 2, (a.y + b.y) / 2], s0: st.s, ox0: st.ox, oy0: st.oy }; }
    else if (p.length === 1) gest = { pinch: false, x: p[0].x, y: p[0].y, ox0: st.ox, oy0: st.oy };
  }
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    const p = pos(e); ptrs.set(e.pointerId, p);
    const moving = st.tool === 'move' || space || e.button === 1;
    if (moving) { startGesture(); return; }
    if (ptrs.size > 1) { cancelStroke(); return; } // 붓 모드에서 두 손가락이 닿으면 그 획은 없던 일로
    if (!ready) return;
    const erase = e.button === 2 || st.mode === 'del' || e.altKey;
    before.getContext('2d').clearRect(0, 0, W, H); before.getContext('2d').drawImage(mask[st.layer], 0, 0);
    const [ix, iy] = toImg(p.x, p.y);
    stroke = { erase, last: [ix, iy], bb: [ix, iy, ix, iy], layer: st.layer };
    grow(stroke.bb, ix, iy); dab(mask[st.layer].getContext('2d'), ix, iy, ix, iy, erase); st.cur = [p.x, p.y]; rebuild(st.layer); draw();
  });
  cv.addEventListener('pointermove', (e) => {
    const p = pos(e);
    if (e.pointerType === 'mouse' || stroke) st.cur = [p.x, p.y];
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
    if (gest) {
      const q = [...ptrs.values()];
      if (gest.pinch && q.length >= 2) {
        const [a, b] = q, d = Math.hypot(a.x - b.x, a.y - b.y), m = [(a.x + b.x) / 2, (a.y + b.y) / 2];
        const ix = (gest.m0[0] - gest.ox0) / gest.s0, iy = (gest.m0[1] - gest.oy0) / gest.s0;
        st.s = Math.max(0.1, Math.min(16, gest.s0 * d / gest.d0)); st.ox = m[0] - ix * st.s; st.oy = m[1] - iy * st.s; zoomTxt();
      } else if (!gest.pinch && q.length) { st.ox = gest.ox0 + q[0].x - gest.x; st.oy = gest.oy0 + q[0].y - gest.y; }
      draw(); return;
    }
    if (stroke) {
      const [ix, iy] = toImg(p.x, p.y);
      dab(mask[stroke.layer].getContext('2d'), stroke.last[0], stroke.last[1], ix, iy, stroke.erase);
      grow(stroke.bb, ix, iy); stroke.last = [ix, iy]; rebuild(stroke.layer);
    }
    draw();
  });
  function up(e) {
    ptrs.delete(e.pointerId);
    if (stroke) {
      const b = stroke.bb.map(Math.round), x0 = Math.max(0, b[0]), y0 = Math.max(0, b[1]), x1 = Math.min(W, b[2]), y1 = Math.min(H, b[3]);
      if (x1 > x0 && y1 > y0) { st.hist.push({ layer: stroke.layer, x: x0, y: y0, data: before.getContext('2d').getImageData(x0, y0, x1 - x0, y1 - y0) }); if (st.hist.length > 40) st.hist.shift(); }
      stroke = null; msg('저장 안 됨', '');
    }
    if (e.pointerType !== 'mouse') st.cur = null;
    if (gest) { if (ptrs.size) startGesture(); else gest = null; }
    draw();
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { st.cur = null; draw(); } });
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const p = pos(e), [ix, iy] = toImg(p.x, p.y);
    st.s = Math.max(0.1, Math.min(16, st.s * Math.exp(-e.deltaY * 0.0015))); st.ox = p.x - ix * st.s; st.oy = p.y - iy * st.s; zoomTxt(); draw();
  }, { passive: false });

  function undo() { const h = st.hist.pop(); if (!h) return; mask[h.layer].getContext('2d').putImageData(h.data, h.x, h.y); rebuild(h.layer); msg('저장 안 됨', ''); draw(); }
  const press = (ids, on) => ids.forEach(([id, v]) => $(id).setAttribute('aria-pressed', v === on));
  function setLayer(k) { st.layer = k; press(CFG.layers.map((l) => ['l-' + l.key, l.key]), k); rebuild(); draw(); }
  function setTool(t) { st.tool = t; press([['t-brush', 'brush'], ['t-move', 'move']], t); cv.classList.toggle('move', t === 'move'); draw(); }
  function setMode(m) { st.mode = m; press([['m-add', 'add'], ['m-del', 'del']], m); if (st.tool !== 'brush') setTool('brush'); draw(); }
  function setView(v) { st.view = v; press([['v-edit', 'edit'], ['v-in', 'in'], ['v-out', 'out']], v); rebuild(); draw(); }
  function setSize(v) { st.size = Math.max(2, Math.min(240, Math.round(v))); $('sz').value = st.size; $('szv').textContent = st.size; draw(); }
  $('t-brush').onclick = () => setTool('brush'); $('t-move').onclick = () => setTool('move');
  $('m-add').onclick = () => setMode('add'); $('m-del').onclick = () => setMode('del');
  $('v-edit').onclick = () => setView('edit'); $('v-in').onclick = () => setView('in'); $('v-out').onclick = () => setView('out');
  $('sz').oninput = (e) => setSize(+e.target.value);
  $('b-fit').onclick = fit; $('b-undo').onclick = undo;
  $('b-bg').onclick = () => { st.bg = (st.bg + 1) % BGS.length; $('b-bg').textContent = '바탕 ' + BGS[st.bg][0]; draw(); };
  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement && e.target.type !== 'range') return;
    if (e.code === 'Space') { space = true; cv.classList.add('move'); e.preventDefault(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { undo(); e.preventDefault(); }
    else if (e.key.toLowerCase() === 'x') setMode(st.mode === 'add' ? 'del' : 'add');
    else if (e.key.toLowerCase() === 'v') setTool(st.tool === 'brush' ? 'move' : 'brush');
    else if (e.key === '[') setSize(st.size / 1.25); else if (e.key === ']') setSize(st.size * 1.25);
    else if (/^[1-9]$/.test(e.key) && CFG.layers[+e.key - 1]) setLayer(CFG.layers[+e.key - 1].key);
    else if (e.key.toLowerCase() === 'f') fit();
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') { space = false; cv.classList.toggle('move', st.tool === 'move'); } });

  // ── 저장 · 불러오기 · 내려받기 (마스크 = 흰색 PNG data URL, 문서 masks/<name>)
  const docPath = 'masks/' + CFG.name;
  const payload = () => { const o = { w: W, h: H, src: CFG.src, savedAt: new Date().toISOString() }; for (const l of CFG.layers) o[l.key] = mask[l.key].toDataURL('image/png'); return o; };
  $('b-save').onclick = async () => {
    if (!db) { msg('저장소에 연결되지 않았습니다', 'bad'); return; }
    const p = payload(), n = CFG.layers.reduce((a, l) => a + p[l.key].length, 0);
    if (n > 250000) { msg('마스크가 너무 큽니다 (자잘한 붓 자국이 많음)', 'bad'); return; }
    msg('저장 중', '');
    try { await db.doc(docPath).set(p); msg('저장했습니다 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }), 'ok'); }
    catch (err) { msg('저장 실패: ' + (err && err.code || '알 수 없음'), 'bad'); }
  };
  $('b-png').onclick = async () => {
    if (!dl) return;
    const c = mk(), x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'destination-in'; x.drawImage(mask[st.layer], 0, 0);
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    try { await dl.save({ filename: `${CFG.name}_${st.layer}.png`, data: blob }); msg('내려받았습니다', 'ok'); }
    catch (err) { if (err && err.code !== 'declined') msg('내려받기 실패: ' + err.code, 'bad'); }
  };
  const loadMask = (k, url) => new Promise((res) => { if (!url || !mask[k]) return res(); const m = new Image(); m.onload = () => { const c = mask[k].getContext('2d'); c.clearRect(0, 0, W, H); c.drawImage(m, 0, 0, W, H); res(); }; m.onerror = () => res(); m.src = url; });

  window.addEventListener('resize', size);
  const imgReady = new Promise((res, rej) => { img.onload = res; img.onerror = rej; if (img.complete && img.naturalWidth) res(); });
  size();
  (async () => {
    try { await imgReady; } catch { msg('원본 그림(' + CFG.src + ')을 열 수 없습니다', 'bad'); return; }
    W = img.naturalWidth; H = img.naturalHeight;
    for (const l of CFG.layers) { mask[l.key] = mk(); tint[l.key] = mk(); }
    shade = mk(); iso = mk(); before = mk();
    size(); fit(); rebuild(); draw();
    const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    [db, dl] = await Promise.all([use('db'), use('downloads')]);
    if (dl) $('b-png').hidden = false;
    if (db) {
      try {
        const d = (await db.doc(docPath).get()).data();
        if (d) { for (const l of CFG.layers) await loadMask(l.key, d[l.key]); msg(d.savedAt ? '불러옴 ' + new Date(d.savedAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '처음 값 불러옴', ''); }
        else msg('저장된 마스크 없음', '');
      } catch (err) { msg('불러오기 실패: ' + (err && err.code || ''), 'bad'); }
    } else msg('저장소 없음', 'bad');
    ready = true; rebuild(); draw();
  })();
})();
</script>
