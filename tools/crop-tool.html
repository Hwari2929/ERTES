<title>ERRANTEs 초상화 크롭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽 기물 목록 · 가운데 원본 위 크롭 틀 · 오른쪽 게임 크기 미리보기. 게임과 같은 어두운 화면 한 가지로 고정 */
:root {
  --bg: #0f1219;
  --panel: #171c26;
  --panel-2: #1e2532;
  --line: #2b3444;
  --fg: #e7e9ee;
  --dim: #8a93a6;
  --accent: #f0b23e;
  --accent-ink: #1b1406;
  --good: #5fd18b;
  --warn: #ef7d5a;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr) 260px; gap: 16px; height: 100%; padding-inline: 16px; padding-block: 12px; box-sizing: border-box; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
header.top h1 { font-size: 1.15rem; margin: 0; letter-spacing: .02em; }
header.top .status { color: var(--dim); font-size: .85rem; }
header.top .status b { color: var(--fg); font-family: var(--f-mono); font-weight: 600; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: auto; min-height: 0; padding: 6px; display: grid; grid-template-columns: 1fr; gap: 2px; align-content: start; }
.unit { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; background: none; color: inherit; font: inherit; text-align: left; }
.unit:hover { background: var(--panel-2); }
.unit:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.unit.sel { border-color: var(--accent); background: var(--panel-2); }
.unit canvas { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-2); }
.unit .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit .nm small { color: var(--dim); font-family: var(--f-mono); font-size: .72rem; display: block; }
.tag { font-size: .7rem; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.tag.saved { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.tag.dirty { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
.stage .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stage .bar h2 { font-size: 1rem; margin: 0 8px 0 0; }
.view { position: relative; background: repeating-conic-gradient(#1a2030 0 25%, #151a26 0 50%) 0 0 / 24px 24px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 320px; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.view canvas.drag { cursor: grabbing; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .85rem; color: var(--dim); }
.ctrl label { display: flex; gap: 8px; align-items: center; }
.ctrl input[type=range] { width: min(260px, 50vw); accent-color: var(--accent); }
.ctrl .num { font-family: var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.btn { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 14px; align-content: start; overflow: auto; min-height: 0; }
.side h3 { margin: 0; font-size: .78rem; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
.pv { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.pv figure { margin: 0; display: grid; gap: 4px; justify-items: center; font-size: .72rem; color: var(--dim); }
.pv canvas { background: var(--panel-2); }
.pv .r { border-radius: 50%; box-shadow: 0 0 0 2px var(--accent); }
.pv .sq { border-radius: 6px; }
.help { color: var(--dim); font-size: .8rem; display: grid; gap: 4px; }
.help kbd { font-family: var(--f-mono); font-size: .72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--fg); }
.out textarea { width: 100%; box-sizing: border-box; height: 90px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font-family: var(--f-mono); font-size: .72rem; resize: vertical; }
.note { font-size: .8rem; color: var(--dim); }
.note.err { color: var(--warn); }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .list { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); max-height: 210px; }
  .view { height: 62vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1>ERRANTEs 초상화 크롭</h1>
    <span class="status" id="status">저장 <b id="nSaved">0</b>/<b id="nAll">0</b></span>
    <span class="note" id="dbNote">저장소 연결 중…</span>
  </header>

  <nav class="list" id="list" aria-label="기물 목록"></nav>

  <section class="stage">
    <div class="bar">
      <h2 id="title">—</h2>
      <button class="btn" id="prev" type="button">이전</button>
      <button class="btn" id="next" type="button">다음</button>
      <button class="btn" id="reset" type="button">기본값으로</button>
      <button class="btn primary" id="save" type="button">저장</button>
    </div>
    <div class="view" id="view"><canvas id="cv"></canvas></div>
    <div class="ctrl">
      <label for="size">크기 <input type="range" id="size" min="40" max="900" step="1"></label>
      <span>x <span class="num" id="vx">0</span> · y <span class="num" id="vy">0</span> · 한 변 <span class="num" id="vs">0</span>px</span>
      <label for="guide"><input type="checkbox" id="guide" checked> 턱 기준선</label>
    </div>
  </section>

  <aside class="side">
    <div>
      <h3>게임에서 보이는 크기</h3>
      <div class="pv">
        <figure><canvas id="p128" class="sq" width="128" height="128" style="width:96px;height:96px"></canvas>상세 56px×2</figure>
        <figure><canvas id="pTok" class="r" width="128" height="128" style="width:64px;height:64px"></canvas>전투 토큰</figure>
        <figure><canvas id="p32" class="sq" width="64" height="64" style="width:32px;height:32px"></canvas>목록</figure>
      </div>
    </div>
    <div class="help">
      <h3>조작</h3>
      <span>틀 안을 끌어 위치 이동, 모서리 점을 끌거나 휠·슬라이더로 크기 조절.</span>
      <span><kbd>←↑→↓</kbd> 1px 이동 (<kbd>Shift</kbd> 10px), <kbd>+</kbd><kbd>−</kbd> 크기, <kbd>S</kbd> 저장, <kbd>[</kbd><kbd>]</kbd> 이전·다음</span>
      <span>점선은 턱 기준선(아래에서 10%)입니다. 턱이 이 선 위에 오게 맞추면 다른 기물과 크기가 맞습니다.</span>
    </div>
    <div class="out">
      <h3>현재 값 (백업용)</h3>
      <textarea id="json" readonly aria-label="크롭 값 JSON"></textarea>
      <button class="btn" id="copy" type="button">복사</button>
      <span class="note" id="copyNote"></span>
    </div>
  </aside>
</div>

<script>
// 기물 목록과 현재 게임에 쓰이는 크롭(원본 832×1216 좌표: 왼쪽 위 x,y · 한 변 s)
const UNITS = /*__UNITS__*/[];
const W = 832, H = 1216;
const byId = Object.fromEntries(UNITS.map((u) => [u.id, u]));
const cur = {};      // 편집 중인 값
const saved = {};    // 저장소에 있는 값
const imgs = {};
let sel = UNITS[0]?.id, db = null;

const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const clampS = (s) => Math.max(40, Math.min(900, Math.round(s)));
for (const u of UNITS) cur[u.id] = { ...u.crop };

function img(id) {
  if (!imgs[id]) {
    const im = new Image();
    im.onload = () => { drawThumb(id); if (id === sel) draw(); };
    im.src = `img/${id}.webp`;
    imgs[id] = im;
  }
  return imgs[id];
}

// ── 목록
function buildList() {
  $('list').innerHTML = UNITS.map((u) => `<button class="unit" type="button" data-id="${u.id}" id="u-${u.id}">
    <canvas width="72" height="72"></canvas><span class="nm">${u.name}<small>${u.id}</small></span><span class="tag" id="t-${u.id}">기본</span></button>`).join('');
  $('list').addEventListener('click', (e) => { const b = e.target.closest('.unit'); if (b) select(b.dataset.id); });
  UNITS.forEach((u) => img(u.id));
}
function drawCrop(c, id, round) {
  const im = imgs[id]; const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  if (!im || !im.complete || !im.naturalWidth) return;
  const { x, y, s } = cur[id];
  g.save();
  if (round) { g.beginPath(); g.arc(c.width / 2, c.height / 2, c.width / 2, 0, Math.PI * 2); g.clip(); }
  g.imageSmoothingQuality = 'high';
  g.drawImage(im, x, y, s, s, 0, 0, c.width, c.height);
  g.restore();
}
function drawThumb(id) { const c = document.querySelector(`#u-${id} canvas`); if (c) drawCrop(c, id, true); }
function same(a, b) { return a && b && a.x === b.x && a.y === b.y && a.s === b.s; }
function tag(id) {
  const t = $('t-' + id); if (!t) return;
  const dirty = saved[id] ? !same(cur[id], saved[id]) : !same(cur[id], byId[id].crop);
  t.className = 'tag ' + (dirty ? 'dirty' : saved[id] ? 'saved' : '');
  t.textContent = dirty ? '수정됨' : saved[id] ? '저장됨' : '기본';
}
function counts() {
  $('nAll').textContent = UNITS.length;
  $('nSaved').textContent = Object.keys(saved).length;
}

// ── 편집 화면
let view = { k: 1, ox: 0, oy: 0 };
function layout() {
  const r = $('view').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const k = Math.min(r.width / W, r.height / H) * 0.96;
  view = { k: k * dpr, ox: (r.width - W * k) / 2 * dpr, oy: (r.height - H * k) / 2 * dpr, dpr };
  draw();
}
function draw() {
  const id = sel; if (!id) return;
  const im = img(id), { k, ox, oy, dpr } = view, c = cur[id];
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (im.complete && im.naturalWidth) ctx.drawImage(im, ox, oy, W * k, H * k);
  const X = ox + c.x * k, Y = oy + c.y * k, S = c.s * k;
  // 틀 밖은 어둡게
  ctx.save(); ctx.fillStyle = 'rgba(8,10,16,.62)';
  ctx.beginPath(); ctx.rect(0, 0, cv.width, cv.height); ctx.rect(X, Y, S, S); ctx.fill('evenodd'); ctx.restore();
  ctx.lineWidth = 2 * dpr; ctx.strokeStyle = '#f0b23e'; ctx.strokeRect(X, Y, S, S);
  if ($('guide').checked) {
    ctx.save(); ctx.setLineDash([6 * dpr, 5 * dpr]); ctx.strokeStyle = 'rgba(240,178,62,.85)';
    ctx.beginPath(); ctx.moveTo(X, Y + S * 0.9); ctx.lineTo(X + S, Y + S * 0.9); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = '#f0b23e';
  for (const [hx, hy] of [[X, Y], [X + S, Y], [X, Y + S], [X + S, Y + S]]) { ctx.beginPath(); ctx.arc(hx, hy, 6 * dpr, 0, Math.PI * 2); ctx.fill(); }
  $('vx').textContent = c.x; $('vy').textContent = c.y; $('vs').textContent = c.s;
  $('size').value = c.s;
  drawCrop($('p128'), id, false); drawCrop($('pTok'), id, true); drawCrop($('p32'), id, false);
  drawThumb(id); tag(id);
  $('json').value = JSON.stringify(Object.fromEntries(UNITS.map((u) => [u.id, [cur[u.id].x, cur[u.id].y, cur[u.id].s]])));
}
function select(id) {
  sel = id;
  document.querySelectorAll('.unit.sel').forEach((e) => e.classList.remove('sel'));
  $('u-' + id)?.classList.add('sel');
  $('u-' + id)?.scrollIntoView({ block: 'nearest' });
  $('title').textContent = `${byId[id].name} · ${id}`;
  draw();
}
function step(d) { const i = UNITS.findIndex((u) => u.id === sel); select(UNITS[(i + d + UNITS.length) % UNITS.length].id); }
function resize(ns, cx, cy) {
  const c = cur[sel]; ns = clampS(ns);
  cx ??= c.x + c.s / 2; cy ??= c.y + c.s / 2;
  const fx = (cx - c.x) / c.s, fy = (cy - c.y) / c.s;
  c.x = Math.round(cx - fx * ns); c.y = Math.round(cy - fy * ns); c.s = ns; draw();
}

// 끌기: 틀 안 = 이동, 모서리 근처 = 크기
let drag = null;
function toImg(e) { const r = cv.getBoundingClientRect(), { k, ox, oy, dpr } = view; return { x: ((e.clientX - r.left) * dpr - ox) / k, y: ((e.clientY - r.top) * dpr - oy) / k }; }
cv.addEventListener('pointerdown', (e) => {
  const p = toImg(e), c = cur[sel], tol = 14 * view.dpr / view.k;
  const corners = [[c.x, c.y, c.x + c.s, c.y + c.s], [c.x + c.s, c.y, c.x, c.y + c.s], [c.x, c.y + c.s, c.x + c.s, c.y], [c.x + c.s, c.y + c.s, c.x, c.y]];
  const hit = corners.find(([hx, hy]) => Math.abs(p.x - hx) < tol && Math.abs(p.y - hy) < tol);
  drag = hit ? { mode: 'size', ax: hit[2], ay: hit[3] } : { mode: 'move', dx: p.x - c.x, dy: p.y - c.y };
  cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
});
cv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const p = toImg(e), c = cur[sel];
  if (drag.mode === 'move') { c.x = Math.round(p.x - drag.dx); c.y = Math.round(p.y - drag.dy); }
  else {
    const s = clampS(Math.max(Math.abs(p.x - drag.ax), Math.abs(p.y - drag.ay)));
    c.x = Math.round(p.x < drag.ax ? drag.ax - s : drag.ax); c.y = Math.round(p.y < drag.ay ? drag.ay - s : drag.ay); c.s = s;
  }
  draw();
});
const end = () => { drag = null; cv.classList.remove('drag'); };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
cv.addEventListener('wheel', (e) => { e.preventDefault(); const p = toImg(e); resize(cur[sel].s * (e.deltaY > 0 ? 1.04 : 1 / 1.04), p.x, p.y); }, { passive: false });
$('size').addEventListener('input', (e) => resize(+e.target.value));
$('guide').addEventListener('change', draw);
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('reset').addEventListener('click', () => { cur[sel] = { ...(saved[sel] || byId[sel].crop) }; draw(); });
$('save').addEventListener('click', () => save(sel));
$('copy').addEventListener('click', () => {
  navigator.clipboard.writeText($('json').value).then(() => { $('copyNote').textContent = '복사했습니다.'; },
    () => { $('json').select(); $('copyNote').textContent = '선택해 두었습니다. 직접 복사해 주세요.'; });
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('textarea, input[type=range]')) return;
  const c = cur[sel], n = e.shiftKey ? 10 : 1;
  const k = e.key;
  if (k === 'ArrowLeft') c.x -= n; else if (k === 'ArrowRight') c.x += n;
  else if (k === 'ArrowUp') c.y -= n; else if (k === 'ArrowDown') c.y += n;
  else if (k === '+' || k === '=') return resize(c.s + n * 4);
  else if (k === '-') return resize(c.s - n * 4);
  else if (k === '[') return step(-1); else if (k === ']') return step(1);
  else if (k === 's' || k === 'S') return save(sel);
  else return;
  e.preventDefault(); draw();
});
new ResizeObserver(layout).observe($('view'));

// ── 저장소: crops/<기물 id> = {x, y, s}
async function save(id) {
  const note = $('dbNote');
  if (!db) { note.textContent = '저장소에 연결되지 않아 저장할 수 없습니다. 오른쪽 값을 복사해 전달해 주세요.'; note.className = 'note err'; return; }
  const c = { ...cur[id] };
  try {
    await db.doc('crops/' + id).set({ x: c.x, y: c.y, s: c.s, at: new Date().toISOString() });
    saved[id] = c; tag(id); counts();
    note.textContent = `${byId[id].name} 저장했습니다.`; note.className = 'note';
  } catch (err) {
    note.textContent = err?.code === 'invalid_argument' ? '이 화면에서는 저장 권한이 없습니다.' : '저장하지 못했습니다. 잠시 후 다시 눌러 주세요.';
    note.className = 'note err';
  }
}
async function connect() {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  const note = $('dbNote');
  if (!db) { note.textContent = '저장소 없이 열렸습니다. 값은 오른쪽에서 복사할 수 있습니다.'; return; }
  note.textContent = '저장소 연결됨';
  db.collection('crops').onSnapshot((snap) => {
    for (const d of snap.docs) {
      const v = d.data(); if (!byId[d.id] || !v) continue;
      const s = { x: v.x, y: v.y, s: v.s };
      const wasClean = !saved[d.id] ? same(cur[d.id], byId[d.id].crop) : same(cur[d.id], saved[d.id]);
      saved[d.id] = s;
      if (wasClean) cur[d.id] = { ...s };
      drawThumb(d.id); tag(d.id);
    }
    counts(); draw();
  }, () => { note.textContent = '저장소 연결이 끊겼습니다. 새로고침해 주세요.'; note.className = 'note err'; });
}

buildList(); counts(); select(sel); layout(); connect();
</script>
